<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Bouton Club Dilerna</title>
<link rel="apple-touch-icon" href="icone-club-dilerna.png">
<meta name="apple-mobile-web-app-title" content="Club Dilerna">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Gloock&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap">
<style>
  /* Maquette téléphone : à gauche le site fermé avec le bouton Club, à droite la fiche ouverte avec les 3 formules en onglets. */
  :root {
    --page: #E9DFD3;
    --site: #FBF6F1;
    --sheet: #FDF8F4;
    --pill: #F2E8E2;
    --ink: #3B2416;
    --ink-soft: #5E4C42;
    --muted: #9A877A;
    --btn: #4A2A1E;
    --btn-fg: #FFF7EF;
    --grip: #DCD3CD;
    --close: #EEE3DA;
    --blob: #E6D5C2;
    --line: #E7DCD3;
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { background: var(--page); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.45; }
  .wrap { padding: 12px 16px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .hint { margin: 0; font-size: 12.5px; color: var(--ink-soft); text-align: center; }
  .intro { text-align: center; max-width: 60ch; }
  .intro h1 { font-family: var(--serif); font-weight: 800; font-size: 26px; margin: 0 0 4px; }
  .intro p { margin: 0; color: var(--ink-soft); font-size: 14px; }
  .fit { width: 100%; display: flex; justify-content: center; overflow: hidden; }
  .phones { display: flex; flex-wrap: wrap; justify-content: center; gap: 28px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .label { font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-soft); }

  /* Téléphone */
  .phone {
    position: relative; width: 395px; height: 832px; flex: none; transform-origin: top center;
    border-radius: 44px; border: 10px solid #2A1A10; background: var(--site);
    overflow: hidden; overflow: clip; box-shadow: 0 30px 60px -30px rgba(59,36,22,.6);
  }
  .site { position: absolute; inset: 0 0 82px 0; overflow: hidden; padding: 40px 18px 0; display: flex; flex-direction: column; gap: 14px; }
  .site .logo { font-family: var(--serif); font-weight: 800; font-size: 28px; letter-spacing: -.01em; text-align: center; }
  .site .hero { border-radius: 22px; height: 210px; background: linear-gradient(160deg, #E8D6C4, #CDB29A); display: grid; place-items: end start; padding: 18px; color: var(--btn-fg); }
  .site .hero b { font-family: var(--serif); font-size: 22px; line-height: 1.15; }
  .site .stars { text-align: center; font-size: 13.5px; color: var(--ink-soft); }
  .site .rdv { align-self: center; border-radius: 999px; padding: 13px 26px; background: var(--btn); color: var(--btn-fg); font-weight: 700; font-size: 14px; }
  .site .ghost { height: 14px; border-radius: 8px; background: var(--line); }
  .site .ghost.s { width: 60%; }

  .placeholder {
    flex: 1; margin-bottom: 16px; border-radius: 22px; border: 2px dashed var(--grip);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    text-align: center; padding: 20px; color: var(--muted);
  }
  .placeholder b { font-size: 16px; color: var(--ink-soft); }
  .placeholder span { font-size: 13.5px; line-height: 1.5; }


  /* Les versions à comparer */
  .variants { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .variants button { border: 1px solid var(--ink-soft); background: transparent; color: var(--ink); border-radius: 999px; padding: 6px 12px; font-family: var(--sans); font-size: 12.5px; font-weight: 700; cursor: pointer; }
  .variants button[aria-pressed="true"] { background: var(--btn); color: var(--btn-fg); border-color: var(--btn); }

  /* 1 · Épurée : pas de bulles, une ligne fine entre chaque avantage */
  ul.va { list-style: none; margin: 14px 0 0; padding: 0; }
  ul.va li { display: flex; gap: 12px; align-items: flex-start; padding: 12px 2px; border-bottom: 1px solid var(--line); }
  ul.va li:last-child { border-bottom: 0; }
  ul.va .emo { width: 24px; text-align: center; font-size: 19px; line-height: 22px; }
  ul.va strong { display: block; font-size: 15px; line-height: 1.3; }
  ul.va p { margin: 3px 0 0; font-size: 13px; line-height: 1.45; color: var(--ink-soft); }
  .extra-title + ul.va { margin-top: 6px; }

  /* 2 · Tuiles : 2 colonnes de petites cartes */
  ul.vb { list-style: none; margin: 14px 0 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  ul.vb li { background: var(--pill); border-radius: 16px; padding: 12px 10px 13px; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  ul.vb .emo { font-size: 22px; line-height: 1; }
  ul.vb strong { font-size: 13.5px; line-height: 1.25; }
  ul.vb p { margin: 0; font-size: 11.5px; line-height: 1.4; color: var(--ink-soft); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .extra-title + ul.vb { margin-top: 10px; }

  /* 3 · Check-list : juste les titres, on touche pour lire le détail */
  ul.vc { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  ul.vc summary { list-style: none; display: flex; align-items: center; gap: 9px; padding: 11px 12px; border-radius: 14px; background: var(--pill); font-size: 14.5px; font-weight: 700; cursor: pointer; }
  ul.vc summary::-webkit-details-marker { display: none; }
  ul.vc summary::after { content: "+"; margin-left: auto; font-size: 18px; font-weight: 500; color: var(--muted); }
  ul.vc details[open] summary::after { content: "−"; }
  ul.vc .ok { flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--btn); color: var(--btn-fg); font-size: 11px; }
  ul.vc .t { min-width: 0; }
  ul.vc p { margin: 6px 12px 6px 41px; font-size: 13px; line-height: 1.45; color: var(--ink-soft); }
  .extra-title + ul.vc { margin-top: 10px; }


  .vlabel { align-self: center; font-size: 12px; font-weight: 700; color: var(--ink-soft); margin-right: 2px; }

  /* Haut A · nom à gauche, prix à droite */
  .hA { padding-top: 8px; }
  .hA-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
  .kicker { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  .hA h2 { font-family: var(--serif); font-weight: 800; font-size: 30px; line-height: 1.05; margin: 2px 0 0; }
  .hA-price { text-align: right; white-space: nowrap; }
  .hA-price b { font-family: var(--serif); font-weight: 800; font-size: 28px; line-height: 1; }
  .hA-price span { display: block; font-size: 12px; color: var(--ink-soft); }
  .hA-meta { margin: 8px 0 0; padding-bottom: 10px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .hA-sub { margin: 10px 0 0; font-size: 14px; color: var(--ink-soft); }

  /* Haut B · badge places + prix dans une pastille */
  .hB { text-align: center; padding-top: 6px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .hB-badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--pill); color: var(--ink-soft); }
  .hB h2 { font-family: var(--serif); font-weight: 800; font-size: 22px; line-height: 1.15; margin: 0; }
  .hB h2 em { font-style: normal; font-size: 1.25em; display: block; }
  .hB-pill { display: inline-flex; align-items: baseline; flex-wrap: wrap; justify-content: center; gap: 4px; padding: 8px 16px; border-radius: 16px; border: 1.5px solid var(--grip); }
  .hB-pill b { font-family: var(--serif); font-weight: 800; font-size: 24px; line-height: 1; }
  .hB-pill span { font-size: 13px; color: var(--ink-soft); }
  .hB-pill small { flex-basis: 100%; font-size: 11.5px; color: var(--muted); }
  .hB-sub { margin: 0; font-size: 14px; color: var(--ink-soft); }

  /* Haut C · minimal, une ligne de prix */
  .hC { text-align: center; padding-top: 8px; }
  .hC h2 { font-family: var(--serif); font-weight: 800; font-size: 30px; line-height: 1.05; margin: 0; }
  .hC-line { margin: 6px 0 0; font-size: 14px; color: var(--ink-soft); }
  .hC-line b { color: var(--ink); }
  .hC-places { margin: 2px 0 0; font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .hC-sub { margin: 8px 0 0; font-size: 14px; color: var(--ink-soft); }


  /* « Tout est inclus » replié en bas, on l'ouvre si on veut */
  details.inc-mini { margin: 14px 0 0; border-radius: 18px; background: var(--btn); color: var(--btn-fg); padding: 0 10px; box-shadow: 0 10px 20px -14px rgba(59,36,22,.8); }
  details.inc-mini .check { background: var(--btn-fg); color: var(--btn); }
  .inc-emos { display: block; padding-left: 24px; font-family: var(--emoji); font-size: 14px; letter-spacing: 1px; line-height: 1.3; filter: sepia(.2) saturate(.9); }
  details.inc-mini .inc-sub { color: var(--grip); }
  details.inc-mini ul.chips li { color: var(--ink); }
  details.inc-mini summary { list-style: none; display: flex; flex-direction: column; gap: 6px; padding: 12px 0; cursor: pointer; }
  details.inc-mini .inc-t { display: flex; align-items: center; gap: 6px; }
  details.inc-mini .check { flex: none; width: 18px; height: 18px; font-size: 11px; }
  .inc-line { min-width: 0; overflow: hidden; white-space: nowrap; font-size: 13.5px; font-weight: 500; letter-spacing: -.01em; }
  .inc-line b { font-weight: 800; letter-spacing: .04em; }
  .inc-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-left: 24px; }
  .inc-row small { font-size: 12px; color: var(--grip); }
  details.inc-mini summary::-webkit-details-marker { display: none; }
  .inc-t { min-width: 0; line-height: 1.3; }
  .inc-more { flex: none; align-self: center; font-size: 12.5px; font-weight: 700; padding: 6px 12px; border-radius: 999px; background: var(--btn-fg); color: var(--btn); }
  details.inc-mini[open] .inc-more { visibility: hidden; }
  details.inc-mini[open] .inc-emos { display: none; }
  details.inc-mini[open] { padding-bottom: 12px; }
  details.inc-mini .inc-sub { margin: 4px 0 6px; }
  details.inc-mini .chips + .inc-sub { margin-top: 10px; }
  .head + .extra-title { margin-top: 16px; }


  /* 5 essais pour le haut de la fiche */
  .h1, .h2v, .h4 { text-align: center; padding-top: 8px; }
  .h1 h2, .h3 h2, .h4 h2, .h5 h2 { font-family: var(--serif); font-weight: 800; letter-spacing: .06em; margin: 0; line-height: 1.05; }

  .h1 h2 { font-size: 32px; }
  .h1-chips { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .h1-price, .h1-places { border-radius: 999px; padding: 6px 12px; font-size: 13px; }
  .h1-price { background: var(--btn); color: var(--btn-fg); }
  .h1-price b { font-size: 15px; }
  .h1-places { background: var(--pill); color: var(--ink); font-weight: 700; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; display: inline-flex; align-items: center; }
  .h1-note { margin: 6px 0 0; font-size: 12px; color: var(--muted); }
  .h1-sub, .h2-sub, .h3-sub, .h4-sub, .h5-sub { margin: 8px 0 0; font-size: 14.5px; color: var(--ink-soft); }

  .h2-kicker { display: block; font-size: 12px; font-weight: 800; letter-spacing: .22em; color: var(--ink-soft); }
  .h2-price { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 4px; }
  .h2-price b { font-family: var(--serif); font-weight: 800; font-size: 50px; line-height: 1; }
  .h2-price span { text-align: left; font-size: 12.5px; line-height: 1.3; color: var(--ink-soft); }
  .h2-places { display: inline-block; margin-top: 8px; font-size: 11.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--btn-fg); background: var(--btn); border-radius: 6px; padding: 4px 10px; }

  .h3 { margin-top: 6px; border: 1.5px solid var(--grip); border-radius: 18px; background: #FFFDFB; overflow: hidden; }
  .h3-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 14px 12px; }
  .h3 h2 { font-size: 26px; }
  .h3-price { text-align: right; }
  .h3-price b { font-family: var(--serif); font-weight: 800; font-size: 28px; line-height: 1; }
  .h3-price span { display: block; font-size: 12px; color: var(--ink-soft); }
  .h3-bottom { display: flex; justify-content: center; gap: 8px; padding: 9px 14px; border-top: 1.5px dashed var(--grip); background: var(--pill); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
  .h3-sub { text-align: center; }

  .h4 h2 { display: flex; align-items: center; gap: 10px; font-size: 30px; }
  .h4 h2::before, .h4 h2::after { content: ""; flex: 1; height: 1.5px; background: var(--grip); }
  .h4-price { margin: 8px 0 0; font-size: 14px; color: var(--ink-soft); }
  .h4-price b { font-family: var(--serif); font-size: 24px; color: var(--ink); }
  .h4-places { display: inline-block; margin-top: 8px; padding: 5px 12px; border: 1.5px solid var(--ink); border-radius: 999px; font-size: 11.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }

  .h5 { padding-top: 8px; }
  .h5-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .h5 h2 { font-size: 34px; }
  .h5-places { text-align: right; font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); max-width: 90px; line-height: 1.3; }
  .h5-price { margin: 6px 0 0; padding-bottom: 10px; border-bottom: 1.5px solid var(--grip); font-size: 16px; }
  .h5-price span { font-size: 12.5px; color: var(--muted); }
  .h5-sub { margin-top: 10px; }


  /* Version « Après » */
  .fav { display: none; position: absolute; top: -9px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-style: normal; font-size: 9.5px; font-weight: 800; padding: 2px 7px; border-radius: 999px; background: #F2C9A0; color: var(--ink); box-shadow: 0 0 0 2px var(--sheet); }
  .phone.after .fav { display: block; }
  .phone.after .tabs { margin-top: 6px; }
  .proof { margin: 0 0 8px; text-align: center; font-size: 12.5px; font-weight: 700; color: var(--ink-soft); }
  details.more { margin-top: 8px; }
  details.more summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; padding: 11px 14px; border-radius: 16px; border: 1.5px dashed var(--grip); font-size: 14px; font-weight: 700; color: var(--ink-soft); }
  details.more summary::-webkit-details-marker { display: none; }
  details.more summary span { font-size: 12.5px; text-decoration: underline; }
  details.more[open] summary { display: none; }
  details.more ul.perks { margin-top: 0; }


  /* Barre du bas copiée de dilerna.fr */
  .tabbar { position: absolute; z-index: 1; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: 1fr 1fr 96px 1fr 1fr; align-items: end; padding: 8px 8px 10px; background: rgb(251, 247, 243); border-radius: 26px 26px 0 0; box-shadow: rgba(33, 2, 2, .3) 0 -6px 24px -12px; }
  .tabbar::before { content: ""; position: absolute; left: 50%; top: -24px; width: 104px; height: 104px; margin-left: -52px; border-radius: 50%; background: rgb(251, 247, 243); box-shadow: rgba(33, 2, 2, .3) 0 -6px 18px -12px; z-index: -1; }
  .tabbar .tab { display: grid; justify-items: center; gap: 4px; padding: 6px 2px; border: 0; background: none; color: rgb(168, 150, 138); text-decoration: none; font: 600 11.5px/1 var(--sans); cursor: default; }
  .tabbar .tab svg { width: 26px; height: 26px; fill: currentColor; stroke: none; }
  .tabbar .tab .tab__hole { fill: rgb(251, 247, 243); }
  .tabbar .tab.is-active { color: rgb(78, 46, 34); }
  .tab__nipper { display: grid; place-items: center; width: 26px; height: 26px; }
  .tabbar .tab__nipper svg { fill: none; }
  .nip__jaw { fill: currentColor; }
  .nip__arm { stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
  .nip__spring { stroke: currentColor; stroke-width: 1.4; fill: none; }
  .nip__pivot { fill: rgb(251, 247, 243); stroke: currentColor; stroke-width: 1.2; }
  .tab__files { display: grid; place-content: center; gap: 6px; width: 26px; height: 26px; }
  .tabbar .file { display: block; width: 24px; height: 6px; }
  .tabbar .file svg { width: 100%; height: 100%; display: block; }
  .file__body { fill: rgb(216, 198, 182); }
  .file__grit { fill: rgb(171, 150, 128); }
  .file__dot { fill: rgb(110, 74, 50); }


  /* ===== 3 nouvelles versions ===== */
  .phone[data-layout="acc"] .tabs, .phone[data-layout="table"] .tabs { display: none; }
  .lay-title { margin: 10px 0 10px; text-align: center; font-family: var(--serif); font-weight: 800; font-size: 22px; }
  .crown-mini { width: 15px; height: 15px; margin-left: 4px; vertical-align: -1px; fill: var(--sheet); stroke: var(--ink); stroke-width: 1.6; stroke-linejoin: round; transform: rotate(14deg); }
  .inc-pill { margin: 10px 0 0; display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 14px; background: var(--btn); color: var(--btn-fg); font-size: 13px; }
  .inc-pill b { letter-spacing: .04em; }
  .inc-pill .check { flex: none; width: 18px; height: 18px; font-size: 11px; background: var(--btn-fg); color: var(--btn); }
  .inc-pill small { margin-left: auto; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--btn-fg); color: var(--btn); }

  /* 1 · Cartes */
  .acc-card { border-radius: 20px; border: 1.5px solid var(--grip); background: #FFFDFB; margin-bottom: 10px; overflow: hidden; }
  .acc-card.open { border: 2px solid var(--btn); box-shadow: 0 12px 24px -18px rgba(59,36,22,.8); }
  .acc-head { width: 100%; border: 0; background: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 14px; text-align: left; font-family: var(--sans); color: var(--ink); }
  .radio { flex: none; width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--grip); }
  .acc-card.open .radio { border: 6px solid var(--btn); }
  .acc-name { flex: 1; min-width: 0; }
  .acc-row { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 6px; }
  .acc-name b { font-family: var(--serif); font-weight: 800; font-size: 19px; letter-spacing: .05em; }
  .acc-name small { display: block; margin-top: 2px; font-size: 12px; color: var(--ink-soft); }
  .acc-fav { font-style: normal; font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 999px; background: #F2C9A0; }
  .acc-price { text-align: right; white-space: nowrap; }
  .acc-price b { font-family: var(--serif); font-weight: 800; font-size: 22px; }
  .acc-price span { display: block; font-size: 11px; color: var(--muted); }
  .acc-body { padding: 0 12px 12px; }
  .acc-body ul.perks { margin-top: 10px; }
  .acc-places { margin: 10px 0 0; text-align: center; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }

  /* 2 · Tableau */
  .tbl-head { position: sticky; top: 0; z-index: 1; display: grid; grid-template-columns: 1fr 58px 58px 58px; gap: 4px; padding: 12px 0 8px; background: var(--sheet); border-bottom: 1.5px solid var(--grip); align-items: end; }
  .tbl-corner { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding-bottom: 6px; }
  .tbl-col { position: relative; border: 1.5px solid var(--grip); border-radius: 14px; background: #FFFDFB; cursor: pointer; padding: 8px 2px 7px; font-family: var(--sans); color: var(--ink); display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .tbl-col b { font-size: 12.5px; }
  .tbl-col span { font-size: 11.5px; color: var(--ink-soft); }
  .tbl-col.on { background: var(--btn); border-color: var(--btn); color: var(--btn-fg); }
  .tbl-col.on span { color: var(--btn-fg); }
  .tbl-col .crown-mini { position: absolute; top: -9px; right: -5px; margin: 0; }
  .tbl-fav { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); font-style: normal; font-size: 11px; }
  .tbl-group { margin: 14px 0 4px; font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .tbl-row { display: grid; grid-template-columns: 1fr 58px 58px 58px; gap: 4px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); }

  /* 3 · Nuancier */
  .sw-dot { display: none; }

  .sw-nude { background: radial-gradient(circle at 32% 30%, #F8E9DC 0 16%, transparent 30%), #D9B496; }

  .sw-drop { flex: none; width: 64px; height: 64px; border-radius: 50% 50% 50% 50% / 58% 58% 42% 42%; background: inherit; box-shadow: inset 0 0 0 2px rgba(255,255,255,.7), 0 10px 18px -10px rgba(59,36,22,.6); position: relative; }
  .sw-drop::after { content: ""; position: absolute; left: 14px; top: 12px; width: 14px; height: 20px; border-radius: 50%; background: rgba(255,255,255,.75); }
  .sw-kicker { font-size: 10.5px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); }
  .sw-hero h2 { margin: 0; font-family: var(--serif); font-weight: 800; font-size: 28px; letter-spacing: .06em; line-height: 1.1; }
  .sw-price { margin: 2px 0 6px; font-size: 13px; color: var(--ink-soft); }
  .sw-price b { font-family: var(--serif); font-size: 24px; color: var(--ink); }
  .sw-places { display: inline-block; font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.7); }
  .sw-who { margin: 10px 0 0; text-align: center; font-size: 14px; color: var(--ink-soft); }
  .pep { margin-top: 12px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pep-i { background: var(--pill); border-radius: 16px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
  .pep-i .emo { font-size: 24px; line-height: 1; width: auto; }
  .pep-i b { font-size: 12px; line-height: 1.25; }


  /* Mix : la base + les pastilles et la couleur du nuancier */
  .phone[data-layout="mix"] .tabs .sw-dot { display: block; width: 22px; height: 22px; border-radius: 50%; margin-bottom: 3px; box-shadow: inset 0 0 0 1.5px rgba(59,36,22,.25), 0 3px 6px -3px rgba(59,36,22,.5); }
  .phone[data-layout="mix"] .tabs .tab[aria-selected="true"] .sw-dot { box-shadow: 0 0 0 2px var(--btn-fg), 0 0 0 4px #F2C9A0; }
  .mix-band { position: relative; overflow: hidden; margin-top: 10px; padding: 14px 12px 16px; border-radius: 22px; box-shadow: inset 0 0 0 1px rgba(59,36,22,.08); }
  .mix-band::before { content: ""; position: absolute; left: -20%; top: -60%; width: 70%; height: 120%; background: radial-gradient(ellipse, rgba(255,255,255,.55), transparent 65%); pointer-events: none; }
  .mix-band > * { position: relative; }
  .mix-band.mix-clear { background: linear-gradient(140deg, #E3ECEF, #C3D4DB); }
  .mix-band.mix-nude { background: linear-gradient(140deg, #F1DCCB, #DDB89B); }
  .mix-band.mix-milky { background: linear-gradient(140deg, #F5EAEC, #E0C6CF); }

  .new { display: inline-block; vertical-align: 1px; margin-left: 4px; font-style: normal; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 1px 7px; border-radius: 999px; background: #F2C9A0; color: var(--ink); }


  /* Espace Milky (réservé aux membres) */
  .milky-pill { position: absolute; top: 14px; right: 14px; z-index: 1; display: inline-flex; align-items: center; gap: 6px; border: 0; cursor: pointer; padding: 8px 12px; border-radius: 999px; background: var(--btn); color: var(--btn-fg); font: 700 12px var(--sans); box-shadow: 0 8px 16px -10px rgba(59,36,22,.8); }
  .milky-pill svg { width: 14px; height: 14px; fill: #F2C9A0; }
  .space { position: absolute; inset: 0; z-index: 5; background: linear-gradient(180deg, #F5EAEC, var(--sheet) 40%); display: flex; flex-direction: column; transform: translateY(102%); }
  @media (prefers-reduced-motion: no-preference) { .space { transition: transform .32s ease; } }
  .phone.space-open .space { transform: none; }
  .space-top { position: relative; text-align: center; padding: 22px 16px 6px; }
  .space-crown { width: 34px; height: 34px; fill: var(--sheet); stroke: var(--ink); stroke-width: 1.4; stroke-linejoin: round; transform: rotate(-8deg); }
  .space-kicker { margin: 2px 0 0; font-size: 11px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  .space-top h2 { margin: 2px 0 0; font-family: var(--serif); font-weight: 800; font-size: 28px; letter-spacing: .04em; }
  .space-lock { padding: 26px 22px; display: flex; flex-direction: column; gap: 12px; text-align: center; }
  .space-lock p { margin: 0; font-size: 15px; color: var(--ink); }
  .space-lock small { color: var(--muted); font-size: 12.5px; }
  .space-lock input { font: 600 18px var(--sans); text-align: center; letter-spacing: .2em; text-transform: uppercase; padding: 14px; border-radius: 16px; border: 2px solid var(--grip); background: #FFFDFB; color: var(--ink); }
  .space-lock input:focus-visible { outline: 2px solid var(--btn); outline-offset: 2px; }
  .space-lock input.err { border-color: #B5543C; }
  .space-err { font-size: 12.5px; font-weight: 700; color: #B5543C; }
  .space-note { font-size: 12.5px !important; color: var(--muted) !important; }
  .space-note a { color: var(--ink); font-weight: 700; }
  .space-home { flex: 1; overflow-y: auto; padding: 8px 16px 20px; }
  .space-hello { margin: 4px 0 14px; text-align: center; font-size: 14px; color: var(--ink-soft); }
  .bubbles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .bubble { position: relative; border: 0; cursor: pointer; text-align: left; padding: 14px 12px; border-radius: 22px; background: #FFFDFB; box-shadow: 0 10px 20px -16px rgba(59,36,22,.7), inset 0 0 0 1px var(--line); display: flex; flex-direction: column; gap: 4px; font-family: var(--sans); color: var(--ink); }
  .bubble .emo { font-size: 26px; line-height: 1; width: auto; margin-bottom: 4px; }
  .bubble b { font-size: 14px; }
  .bubble small { font-size: 11.5px; color: var(--ink-soft); }
  .bubble.big { grid-column: 1 / -1; background: var(--btn); color: var(--btn-fg); }
  .bubble.big small { color: var(--grip); }
  .badge { position: absolute; top: 12px; right: 12px; font-style: normal; font-size: 12px; font-weight: 800; min-width: 22px; height: 22px; border-radius: 999px; display: grid; place-items: center; background: #F2C9A0; color: var(--ink); }


  /* Photo test */
  .pt { flex: 1; overflow-y: auto; padding: 0 16px 20px; }
  .pt-bar { display: flex; align-items: center; gap: 8px; padding: 4px 0 8px; }
  .pt-back { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--close); font-size: 22px; line-height: 1; cursor: pointer; color: var(--ink); }
  .pt-bar b { flex: 1; font-size: 16px; }
  .pt-count { font-size: 11px; font-weight: 800; padding: 4px 9px; border-radius: 999px; background: #F2C9A0; }
  .pt-steps { list-style: none; margin: 0 0 14px; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; counter-reset: st; }
  .pt-steps li { counter-increment: st; font-size: 11px; font-weight: 700; color: var(--muted); padding-top: 6px; border-top: 3px solid var(--grip); }
  .pt-steps li::before { content: counter(st) ". "; }
  .pt-steps li.on { color: var(--ink); border-top-color: var(--btn); }
  .pt-step { display: flex; flex-direction: column; gap: 10px; }
  .pt-shot { height: 300px; border-radius: 24px; border: 2px dashed var(--grip); background: #FFFDFB; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; }
  .pt-shot .emo { font-size: 64px; width: auto; }
  .pt-shot b { font-size: 16px; }
  .pt-shot small { font-size: 12.5px; color: var(--muted); }
  .pt-ghost { border: 1.5px solid var(--grip); background: transparent; border-radius: 999px; padding: 13px; font: 700 14px var(--sans); color: var(--ink); cursor: pointer; }
  .pt-label { margin: 6px 0 -2px; font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .pt-gal { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .pt-gal span { aspect-ratio: 3 / 4; border-radius: 14px; display: grid; place-items: end center; padding-bottom: 6px; font-size: 11px; font-weight: 800; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(59,36,22,.12); }
  .pt-gal span.on { box-shadow: 0 0 0 2px var(--sheet), 0 0 0 4px var(--btn); }
  .pt-input { font: 500 14px var(--sans); padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--grip); background: #FFFDFB; color: var(--ink); }
  .pt-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .pt-chips button { border: 1.5px solid var(--grip); background: #FFFDFB; border-radius: 999px; padding: 7px 12px; font: 700 12.5px var(--sans); color: var(--ink); cursor: pointer; }
  .pt-chips button.on { background: var(--btn); border-color: var(--btn); color: var(--btn-fg); }
  .pt-result { position: relative; height: 300px; border-radius: 24px; overflow: hidden; display: grid; grid-template-columns: 1fr 1fr; }
  .pt-half { display: flex; align-items: flex-end; padding: 10px; }
  .pt-half span { font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.85); }
  .pt-half.before { background: linear-gradient(160deg, #EAD9CB, #D9BFA9); }
  .pt-half.after { justify-content: flex-end; background: radial-gradient(circle at 60% 40%, rgba(255,255,255,.5), transparent 40%), linear-gradient(160deg, #8E1F2C, #5A0F19); }
  .pt-handle { position: absolute; left: 50%; top: 0; bottom: 0; width: 3px; margin-left: -1.5px; background: #fff; }
  .pt-handle::after { content: "‹ ›"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 34px; height: 34px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-style: normal; font-size: 13px; font-weight: 800; color: var(--ink); }
  .pt-price { margin: 0; font-size: 13px; color: var(--ink-soft); text-align: center; }
  .pt-actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .pt-act { border: 0; border-radius: 16px; background: #FFFDFB; box-shadow: inset 0 0 0 1px var(--line); padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; font: 700 11.5px var(--sans); color: var(--ink); cursor: pointer; font-size: 20px; }
  .pt-act span { font-size: 11.5px; }
  .pt-disclaimer { margin: 0; text-align: center; font-size: 11.5px; color: var(--muted); }

  .pt-shot.has-img { position: relative; border: 0; overflow: hidden; padding: 0; }
  .pt-shot.has-img img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; display: block; }
  .pt-ex { position: absolute; left: 10px; top: 10px; font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.9); color: var(--ink); }
  .pt-tips { margin: -2px 0 0; text-align: center; font-size: 12px; color: var(--muted); }

  .pt-half.before { background: url(main-cherry.jpg) 50% 35% / cover !important; }
  .pt-half.after { position: relative; background: url(main-cherry.jpg) 50% 35% / cover !important; }
  .pt-half.after::before { content: ""; position: absolute; inset: 0; background: rgba(253,248,244,.6); backdrop-filter: blur(2px); }
  .pt-half.after > * { position: relative; }
  .pt-ai { position: absolute !important; left: 8px; right: 8px; top: 38%; text-align: center; font-style: normal; font-size: 12.5px; font-weight: 800; line-height: 1.3; color: var(--ink); }
  .pt-intro { margin: 0; font-size: 14px; color: var(--ink-soft); text-align: center; }
  .pt-half.after > * { position: relative; }
  .pt-ai { position: absolute !important; left: 8px; right: 8px; top: 40%; text-align: center; font-style: normal; font-size: 12px; font-weight: 800; line-height: 1.3; color: var(--ink); }

  .pt-file { display: block; text-align: center; cursor: pointer; }
  .pt-link { border: 0; background: none; font: 600 12.5px var(--sans); color: var(--muted); text-decoration: underline; cursor: pointer; }
  .pt-half.before { background-size: cover !important; background-position: 50% 35% !important; }
  .pt-half.after { background-size: cover !important; background-position: 50% 35% !important; }
  .pt-half.after.done::before, .pt-half.after.done .pt-ai { display: none; }

  .pt-btn { display: flex; align-items: center; justify-content: center; gap: 9px; }
  .btn-ico { width: 21px; height: 21px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .btn-ico .fill { fill: #F2C9A0; stroke: currentColor; }


  /* Résultat Photo test : 3 façons de comparer */
  .rs-switch { display: flex; justify-content: center; gap: 6px; }
  .rs-switch button { border: 1px solid var(--grip); background: #FFFDFB; border-radius: 999px; padding: 5px 11px; font: 700 11.5px var(--sans); color: var(--ink-soft); cursor: pointer; }
  .rs-switch button.on { background: var(--btn); border-color: var(--btn); color: var(--btn-fg); }
  .rs { display: flex; flex-direction: column; gap: 10px; }
  .rs-photo { position: relative; height: 380px; border-radius: 26px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; box-shadow: 0 16px 30px -22px rgba(59,36,22,.8); }
  .rs-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 38%; -webkit-user-drag: none; pointer-events: none; }
  .rs-before { opacity: 0; transition: opacity .18s ease; }
  .rs-tag { position: absolute; top: 12px; left: 12px; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 5px 11px; border-radius: 999px; background: rgba(255,255,255,.92); color: var(--ink); }
  .rs-hint { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); white-space: nowrap; font-size: 11.5px; font-weight: 700; padding: 7px 12px; border-radius: 999px; background: rgba(59,36,22,.78); color: var(--btn-fg); }
  .rs-wait { position: absolute; inset: auto 12px 50% 12px; text-align: center; font-style: normal; font-size: 13px; font-weight: 800; padding: 10px; border-radius: 14px; background: rgba(255,255,255,.9); color: var(--ink); }
  .rs-range, .rs-line, .rs-thumb, .rs-fab, .rs-btns, .rs-btns-c, .rs-hint { display: none; }

  /* 1 · Touche : on maintient le doigt pour voir l'avant */
  .rs[data-rs="A"] .rs-hint { display: block; }
  .rs[data-rs="A"] .rs-photo.show-before .rs-before { opacity: 1; }
  .rs[data-rs="A"] .rs-btns { display: grid; }

  /* 2 · Curseur : on fait glisser le trait */
  .rs[data-rs="B"] .rs-before { opacity: 1; clip-path: inset(0 calc(100% - var(--cut, 50%)) 0 0); transition: none; }
  .rs[data-rs="B"] .rs-tag { display: none; }
  .rs[data-rs="B"] .rs-range { display: block; position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize; z-index: 2; }
  .rs[data-rs="B"] .rs-line { display: block; position: absolute; top: 0; bottom: 0; left: var(--cut, 50%); width: 3px; margin-left: -1.5px; background: #fff; pointer-events: none; }
  .rs[data-rs="B"] .rs-line::after { content: "‹ ›"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 38px; height: 38px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-style: normal; font-weight: 800; color: var(--ink); box-shadow: 0 6px 14px -6px rgba(0,0,0,.5); }
  .rs[data-rs="B"] .rs-fab { display: flex; position: absolute; right: 12px; bottom: 12px; gap: 8px; z-index: 3; }
  .rs-fab button { width: 46px; height: 46px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; background: rgba(255,255,255,.95); color: var(--ink); box-shadow: 0 8px 16px -8px rgba(0,0,0,.5); }
  .rs-fab button[data-save] { background: var(--btn); color: var(--btn-fg); }

  /* 3 · Vignette : l'avant en petit dans le coin */
  .rs[data-rs="C"] .rs-thumb { display: block; position: absolute; left: 12px; bottom: 12px; width: 78px; height: 104px; padding: 0; border: 3px solid #fff; border-radius: 16px; overflow: hidden; cursor: pointer; box-shadow: 0 8px 18px -8px rgba(0,0,0,.6); }
  .rs-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .rs-thumb span { position: absolute; left: 0; right: 0; bottom: 0; font-size: 10px; font-weight: 800; padding: 3px 0; background: rgba(255,255,255,.9); color: var(--ink); text-align: center; }
  .rs[data-rs="C"] .rs-photo.swap .rs-before { opacity: 1; }
  .rs[data-rs="C"] .rs-btns-c { display: flex; flex-direction: column; align-items: center; gap: 4px; }

  /* Boutons */
  .rs-btns { grid-template-columns: 1fr 1fr; gap: 8px; }
  .rs-b { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 999px; font: 700 15px var(--sans); cursor: pointer; line-height: 1; }
  .rs-b.ghost { border: 1.5px solid var(--ink); background: transparent; color: var(--ink); }
  .rs-b.full { border: 0; background: var(--btn); color: var(--btn-fg); }
  .rs-b.wide { width: 100%; }
  .rs-link { border: 0; background: none; padding: 8px; font: 700 13px var(--sans); color: var(--ink-soft); text-decoration: underline; cursor: pointer; }
  .ico { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }


  /* Variantes de « Touche » */
  .rs-seg, .rs-glass, .rs-peek, .rs-corner { display: none; }
  .rs-photo.show-before .rs-before { opacity: 1; }
  /* 1b · Interrupteur Avant | Après */
  .rs[data-rs="D"] .rs-seg { display: flex; position: absolute; top: 12px; left: 50%; transform: translateX(-50%); padding: 4px; gap: 2px; border-radius: 999px; background: rgba(255,255,255,.85); backdrop-filter: blur(6px); z-index: 2; }
  .rs-seg button { border: 0; background: none; padding: 7px 16px; border-radius: 999px; font: 800 12.5px var(--sans); color: var(--ink-soft); cursor: pointer; }
  .rs-seg button.on { background: var(--btn); color: var(--btn-fg); }
  .rs[data-rs="D"] .rs-tag { display: none; }
  .rs[data-rs="D"] .rs-btns { display: grid; }
  /* 1c · Plein écran, boutons dans une barre givrée */
  .rs[data-rs="E"] .rs-photo { height: 470px; }
  .rs[data-rs="E"] .rs-hint { display: block; top: 12px; bottom: auto; left: auto; right: 12px; transform: none; font-size: 10.5px; }
  .rs[data-rs="E"] .rs-glass { display: flex; position: absolute; left: 10px; right: 10px; bottom: 10px; align-items: stretch; border-radius: 22px; background: rgba(253,248,244,.82); backdrop-filter: blur(10px); z-index: 2; overflow: hidden; }
  .rs-glass button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 54px; border: 0; background: none; font: 800 14.5px var(--sans); color: var(--ink); cursor: pointer; }
  .rs-glass button[data-save] { background: var(--btn); color: var(--btn-fg); }
  .rs-glass i { width: 0; }
  /* 1d · Gros bouton « Voir l'avant » + petits ronds en haut */
  .rs[data-rs="F"] .rs-peek { display: block; position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); white-space: nowrap; border: 0; padding: 12px 20px; border-radius: 999px; background: rgba(255,255,255,.92); font: 800 13px var(--sans); color: var(--ink); cursor: pointer; box-shadow: 0 8px 18px -10px rgba(0,0,0,.6); z-index: 2; touch-action: none; }
  .rs[data-rs="F"] .rs-corner { display: flex; position: absolute; top: 10px; right: 10px; gap: 8px; z-index: 2; }
  .rs-corner button { width: 42px; height: 42px; border-radius: 50%; border: 0; display: grid; place-items: center; background: rgba(255,255,255,.92); color: var(--ink); cursor: pointer; box-shadow: 0 6px 14px -8px rgba(0,0,0,.6); }
  .rs-corner button[data-save] { background: var(--btn); color: var(--btn-fg); }

  [data-shot-before] { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
  .tile { aspect-ratio: 1; border-radius: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 14px; text-align: center; cursor: pointer; background: #FFFDFB; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--grip), 0 14px 26px -22px rgba(59,36,22,.9); font: 800 14px/1.25 var(--sans); }
  .tile .ico { width: 40px; height: 40px; stroke-width: 1.5; }
  .tile.dark { background: var(--btn); color: var(--btn-fg); box-shadow: 0 14px 26px -18px rgba(59,36,22,.9); }
  .tile:active { transform: scale(.97); }
  .teaser { grid-column: 1 / -1; margin-bottom: 2px; padding: 10px; border-radius: 26px; background: #FFFDFB; box-shadow: inset 0 0 0 1px var(--line); }
  .teaser-imgs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .teaser figure { position: relative; margin: 0; height: 250px; border-radius: 18px; overflow: hidden; }
  .teaser img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 32%; display: block; }
  .teaser figcaption { position: absolute; left: 8px; top: 8px; font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.92); }
  .teaser p { margin: 10px 4px 2px; text-align: center; font-size: 13.5px; color: var(--ink-soft); }
  [data-shot-before][hidden] { display: none; }


  /* Étape 1 : 3 façons de remplir le haut */
  .s1-switch { display: flex; justify-content: center; gap: 6px; }
  .s1-switch button { border: 1px solid var(--grip); background: #FFFDFB; border-radius: 999px; padding: 5px 11px; font: 700 11.5px var(--sans); color: var(--ink-soft); cursor: pointer; }
  .s1-switch button.on { background: var(--btn); border-color: var(--btn); color: var(--btn-fg); }
  .s1-a, .s1-b, .s1-c { display: none; }
  .s1[data-s1="A"] .s1-a, .s1[data-s1="B"] .s1-b, .s1[data-s1="C"] .s1-c { display: flex; }
  .s1-a { position: relative; height: 330px; border-radius: 26px; overflow: hidden; align-items: flex-end; }
  .s1-a img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 35%; }
  .s1-a div { position: relative; width: 100%; padding: 40px 16px 16px; background: linear-gradient(transparent, rgba(42,26,16,.75)); color: #FFF7EF; display: flex; flex-direction: column; gap: 2px; }
  .s1-a b { font-family: var(--serif); font-weight: 800; font-size: 22px; }
  .s1-a span { font-size: 13px; opacity: .9; }
  .s1-b { flex-direction: column; align-items: center; gap: 14px; padding: 20px 8px 10px; }
  .s1-b > b { font-family: var(--serif); font-weight: 800; font-size: 20px; text-align: center; }
  .nails { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 10px; width: 100%; }
  .nail { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 0 10px; border-radius: 18px; background: #FFFDFB; box-shadow: inset 0 0 0 1px var(--line); }
  .nail svg { width: 30px; height: 46px; }
  .nail svg path { fill: #B98A6E; stroke: var(--ink); stroke-width: 1; stroke-linejoin: round; }
  .nail svg path.shine { fill: none; stroke: rgba(255,255,255,.75); stroke-width: 1.6; stroke-linecap: round; }
  .nail span { font-size: 12px; font-weight: 700; }
  .s1-c { flex-direction: column; align-items: center; text-align: center; gap: 4px; padding: 26px 16px 18px; border-radius: 26px; background: linear-gradient(140deg, #F5EAEC, #E0C6CF); }
  .s1-c > b { font-family: var(--serif); font-weight: 800; font-size: 56px; line-height: 1; }
  .s1-c > span { font-size: 14px; font-weight: 700; }
  .dots { display: flex; gap: 6px; margin: 10px 0 6px; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; background: rgba(59,36,22,.15); }
  .dots i.on { background: var(--btn); }
  .s1-c small { font-size: 12.5px; color: var(--ink-soft); max-width: 30ch; }


  /* Recadrage */
  .pt-shot.has-img { touch-action: none; cursor: grab; }
  .pt-shot.has-img.dragging { cursor: grabbing; }
  .pt-shot.has-img img { -webkit-user-drag: none; user-select: none; }
  .crop-hint { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); white-space: nowrap; font-size: 11.5px; font-weight: 800; padding: 7px 12px; border-radius: 999px; background: rgba(59,36,22,.78); color: #FFF7EF; pointer-events: none; }
  .crop-grid { display: none; position: absolute; inset: 0; pointer-events: none; background:
    linear-gradient(to right, transparent 33.2%, rgba(255,255,255,.6) 33.3%, rgba(255,255,255,.6) 33.6%, transparent 33.7%, transparent 66.5%, rgba(255,255,255,.6) 66.6%, rgba(255,255,255,.6) 66.9%, transparent 67%),
    linear-gradient(to bottom, transparent 33.2%, rgba(255,255,255,.6) 33.3%, rgba(255,255,255,.6) 33.6%, transparent 33.7%, transparent 66.5%, rgba(255,255,255,.6) 66.6%, rgba(255,255,255,.6) 66.9%, transparent 67%); }
  .pt-shot.dragging .crop-grid { display: block; }
  .crop-zoom { display: flex; align-items: center; gap: 10px; padding: 0 6px; font-size: 12px; font-weight: 800; color: var(--ink-soft); }
  .crop-zoom[hidden] { display: none; }
  .crop-zoom input { flex: 1; accent-color: var(--btn); }
  .rs-photo img { transition: none; }

  button.nail { border: 0; cursor: pointer; font-family: var(--sans); color: var(--ink); transition: transform .15s ease, box-shadow .15s ease; }
  button.nail:active { transform: scale(.96); }
  button.nail.on { background: var(--pill); box-shadow: inset 0 0 0 2px var(--btn); }
  button.nail.on svg path:not(.shine) { fill: #8E5A44; }
  button.nail:focus-visible { outline: 2px solid var(--btn); outline-offset: 2px; }

  .pt-q { margin: 2px 0 2px; text-align: center; font-family: var(--serif); font-weight: 800; font-size: 20px; }

  html.real-phone body { background: var(--site); }
  html.real-phone .wrap { padding: 0; gap: 0; }
  html.real-phone .variants { display: none; }
  html.real-phone .fit { height: 100vh; }
  html.real-phone .phone { width: 100vw; height: 100vh; max-width: none; border: 0; border-radius: 0; box-shadow: none; }


  /* Thème + photo d'inspiration */
  .opt { font-style: normal; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--muted); }
  .pt-theme { font: 500 14px/1.4 var(--sans); padding: 12px 14px; border-radius: 16px; border: 1.5px solid var(--grip); background: #FFFDFB; color: var(--ink); resize: none; }
  .pt-theme:focus-visible { outline: 2px solid var(--btn); outline-offset: 1px; }
  .insp-add { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; border: 1.5px dashed var(--grip); background: #FFFDFB; cursor: pointer; font: 700 13.5px/1.3 var(--sans); color: var(--ink); }
  .insp-add[hidden] { display: none; }
  .insp-add .ico { width: 28px; height: 28px; }
  .insp-add small { font-weight: 500; color: var(--muted); }
  .insp-prev { position: relative; margin: 0; width: 110px; height: 140px; border-radius: 18px; overflow: hidden; box-shadow: 0 10px 20px -14px rgba(59,36,22,.8); }
  .insp-prev img { width: 100%; height: 100%; object-fit: cover; }
  .insp-prev button { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(255,255,255,.95); font-size: 16px; line-height: 1; cursor: pointer; }


  /* Ma galerie */
  .gal { flex: 1; overflow-y: auto; padding: 0 16px 20px; position: relative; }
  .gal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .gal-item { border: 0; padding: 0; border-radius: 18px; overflow: hidden; aspect-ratio: 3 / 4; cursor: pointer; background: var(--pill); }
  .gal-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gal-load { grid-column: 1 / -1; text-align: center; color: var(--muted); font-size: 13px; }
  .gal-empty { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 40px 10px; }
  .gal-empty[hidden] { display: none; }
  .gal-empty .emo { font-size: 44px; width: auto; }
  .gal-empty b { font-family: var(--serif); font-size: 20px; }
  .gal-empty small { color: var(--ink-soft); font-size: 13px; margin-bottom: 8px; }
  .gal-view { position: fixed; inset: 0; z-index: 10; background: rgba(30,18,10,.92); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px; }
  .gal-view[hidden] { display: none; }
  .gal-view img { max-width: 100%; max-height: 72%; border-radius: 20px; }
  .gal-close { position: absolute; top: 16px; right: 16px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: #fff; font-size: 20px; cursor: pointer; }
  .gal-save { text-decoration: none; max-width: 340px; }
  .gal-saved { margin: 0; text-align: center; font-size: 12.5px; font-weight: 800; color: #4C7A4F; }
  .gal-saved[hidden] { display: none; }

  /* Barre du bas */
  .nav {
    position: absolute; left: 0; right: 0; bottom: 0; height: 74px; padding: 0 8px 10px;
    background: #FFFDFB; border-top: 1px solid var(--line);
    display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1fr; align-items: center;
  }
  .nav a { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 500; color: var(--ink-soft); text-decoration: none; }
  .nav svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  /* Bouton du milieu : copie du bouton déjà présent sur dilerna.fr */
  .tab-rdv { position: relative; place-self: start center; width: 90px; height: 90px; margin-top: -34px; padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: transform .3s ease; }
  .tab-rdv svg { width: 100%; height: 100%; display: block; filter: drop-shadow(rgba(33, 2, 2, .25) 0 6px 10px); }
  .tab-rdv__bg { fill: rgb(171, 150, 128); }
  .tab-rdv__txt { font: 700 11.5px var(--sans); letter-spacing: 1.6px; fill: rgb(78, 46, 34); }
  .tab-rdv__cap { fill: rgb(242, 232, 225); }
  .tab-rdv__neck { fill: rgb(213, 198, 175); }
  .tab-rdv__glass { fill: rgb(78, 46, 34); stroke: rgb(251, 247, 243); stroke-width: 1.5; }
  .tab-rdv__shine { fill: rgba(255, 255, 255, .7); }
  .tab-rdv__spark { stroke: rgb(248, 244, 236); stroke-width: 2.4; stroke-linecap: round; fill: none; }
  .tab-rdv:active { transform: scale(.94); }
  @media (hover: hover) { .tab-rdv:hover { transform: translateY(-3px) rotate(-4deg); } }
  @media (prefers-reduced-motion: no-preference) {
    .tab-rdv__bottle { transform-box: fill-box; transform-origin: 50% 100%; animation: bottleWiggle 6s ease-in-out infinite; }
    @keyframes bottleWiggle { 0%, 86%, 100% { transform: rotate(0deg); } 90% { transform: rotate(-9deg); } 94% { transform: rotate(7deg); } 97% { transform: rotate(-3deg); } }
  }
  .tab-rdv:focus-visible, .tab:focus-visible, .cta:focus-visible, .close:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  @media (prefers-reduced-motion: no-preference) {
    .club-btn .dot { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(1.35); } }
    .sheet { transition: transform .32s ease; }
    .scrim { transition: opacity .32s ease; }
  }

  /* Fiche qui monte */
  .scrim { z-index: 2; position: absolute; inset: 0; background: rgba(42,26,16,.45); opacity: 0; pointer-events: none; }
  .phone.open .scrim { opacity: 1; pointer-events: auto; }
  .sheet {
    z-index: 3; position: absolute; left: 0; right: 0; bottom: 0; height: 90%;
    background: var(--sheet); border-radius: 28px 28px 0 0;
    transform: translateY(102%); display: flex; flex-direction: column; overflow: hidden;
  }
  .phone.open .sheet { transform: none; }
  .sheet .blob { position: absolute; top: -70px; right: -50px; width: 150px; height: 150px; border-radius: 50%; background: var(--blob); pointer-events: none; }
  .sheet-top { position: relative; padding: 10px 16px 12px; }
  .grip { width: 44px; height: 5px; border-radius: 99px; background: var(--grip); margin: 0 auto; }
  .close { position: absolute; top: 12px; left: 12px; width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--close); color: var(--ink); font-size: 19px; cursor: pointer; }
  .eyebrow { text-align: center; margin: 14px 0 10px; font-size: 11px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }

  .tabs { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; border-radius: 18px; background: var(--pill); }
  .tab {
    border: 0; cursor: pointer; border-radius: 14px; padding: 8px 4px; background: transparent; color: var(--ink-soft);
    font-family: var(--sans); display: flex; flex-direction: column; align-items: center; gap: 1px;
  }
  .tab b { font-size: 13.5px; font-weight: 700; }
  .tab { position: relative; }
  .tab-crown { position: absolute; top: -11px; right: -7px; width: 22px; height: 22px; transform: rotate(16deg); pointer-events: none; }
  .tab-crown path, .tab-crown circle { fill: var(--sheet); stroke: var(--ink); stroke-linejoin: round; }
  .tab-crown path { stroke-width: 1.5; }
  .tab-crown circle { stroke-width: 1.3; }
  .crown { font-family: var(--emoji); font-size: .85em; line-height: 1; filter: sepia(.25) saturate(.85); }
  .tab span { font-size: 12px; }
  .tab[aria-selected="true"] { background: var(--btn); color: var(--btn-fg); box-shadow: 0 6px 14px -8px rgba(59,36,22,.7); }

  .body { flex: 1; overflow-x: hidden; overflow-y: auto; padding: 4px 16px 18px; -webkit-overflow-scrolling: touch; }
  .head { text-align: center; display: flex; flex-direction: column; gap: 2px; padding-top: 6px; }
  .places { font-size: 15px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ink); }
  .head h2 { font-family: var(--serif); font-weight: 800; font-size: 30px; line-height: 1.1; letter-spacing: .06em; margin: 4px 0 2px; }
  .price { display: flex; justify-content: center; align-items: baseline; gap: 6px; margin-top: 4px; }
  .price b { font-family: var(--serif); font-weight: 800; font-size: 46px; line-height: 1; }
  .price span { font-size: 15px; font-weight: 500; color: var(--ink-soft); }
  .note { font-size: 12.5px; color: var(--muted); }
  .sub { margin: 4px 0 0; font-size: 15px; color: var(--ink-soft); }

  .included { margin: 16px 0 0; padding: 12px 12px 14px; border-radius: 18px; background: var(--pill); border: 2px solid var(--ink-soft); display: flex; flex-direction: column; gap: 8px; }
  .inc-title { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; line-height: 1.3; }
  .check { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--btn); color: var(--btn-fg); font-size: 14px; }
  .inc-sub { margin: 2px 0 -2px; font-size: 10.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  ul.chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 5px; }
  ul.chips li { display: inline-flex; align-items: center; gap: 4px; padding: 4px 9px 4px 6px; border-radius: 999px; font-size: 12.5px; font-weight: 500; background: var(--sheet); border: 1px solid var(--grip); }

  .extra-title { display: flex; align-items: center; gap: 10px; margin: 20px 2px 0; font-size: 11px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  .extra-title::before, .extra-title::after { content: ""; flex: 1; height: 1px; background: var(--grip); }
  ul.perks { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .extra-title + ul.perks { margin-top: 10px; }
  ul.perks li { background: var(--pill); border-radius: 16px; padding: 10px 12px; display: flex; align-items: flex-start; gap: 10px; font-size: 14px; line-height: 1.4; }
  ul.perks strong { font-weight: 700; }
  .emo { flex: none; font-family: var(--emoji); font-size: 17px; line-height: 20px; filter: grayscale(1) sepia(.75) saturate(1.15) brightness(.8); }
  ul.perks .emo { width: 22px; text-align: center; }
  ul.chips .emo { font-size: 13px; line-height: 1; }

  .sheet-foot { padding: 10px 16px 16px; border-top: 1px solid var(--line); background: var(--sheet); }
  .cta { display: block; width: 100%; border: 0; border-radius: 999px; padding: 16px 10px; background: var(--btn); color: var(--btn-fg); font-family: var(--sans); font-size: 14.5px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .legal { margin: 10px 0 0; text-align: center; font-size: 10.5px; color: var(--muted); }
  .legal a, .onb-note a { color: inherit; text-decoration: underline; }
  .foot-note { margin: 6px 0 0; text-align: center; font-size: 10.5px; line-height: 1.35; color: var(--muted); }


  /* ===================== Habillage premium de l'Espace Milky ===================== */
  .space { --p-bg: #FAF7F3; --p-card: #FFFFFF; --p-line: rgba(43,26,16,.10); --p-ink: #2B1A10; --p-soft: #8A7A70; --p-gold: #B8916E; background: var(--p-bg) !important; color: var(--p-ink); }
  .space .space-top { padding: 30px 22px 10px; }
  .space .close { background: transparent; border: 1px solid var(--p-line); width: 36px; height: 36px; font-size: 17px; color: var(--p-ink); }
  .space .space-crown { width: 24px; height: 24px; stroke-width: 1.2; transform: none; }
  .space .space-kicker { font-size: 10px; font-weight: 600; letter-spacing: .26em; color: var(--p-soft); margin-top: 6px; }
  .space .space-top h2 { font-weight: 500; font-size: 27px; letter-spacing: .01em; margin-top: 4px; }
  .space .space-hello { font-size: 13.5px; color: var(--p-soft); margin: 2px 0 18px; }

  /* Bulles d'accueil */
  .space .bubbles { gap: 10px; }
  .space .bubble { background: var(--p-card); border-radius: 20px; padding: 16px 14px 15px; gap: 3px; box-shadow: none; border: 1px solid var(--p-line); transition: transform .15s ease; }
  .space .bubble:active { transform: scale(.98); }
  .space .bi { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; margin-bottom: 10px; }
  .space .bubble b { font-size: 14px; font-weight: 600; letter-spacing: .005em; }
  .space .bubble small { font-size: 12px; color: var(--p-soft); line-height: 1.35; }
  .space .bubble.big { background: var(--p-ink); border-color: var(--p-ink); color: #FBF7F2; }
  .space .bubble.big small { color: rgba(251,247,242,.65); }
  .space .badge { background: var(--p-gold); color: #fff; font-weight: 700; }

  /* En-tête des sous-pages */
  .space .pt-bar { padding: 2px 0 12px; }
  .space .pt-back { background: transparent; border: 1px solid var(--p-line); width: 34px; height: 34px; font-size: 20px; color: var(--p-ink); }
  .space .pt-bar b { font-size: 15px; font-weight: 600; text-align: center; margin-right: -34px; }
  .space .pt-count { background: none; padding: 0; font-size: 11.5px; font-weight: 500; color: var(--p-soft); }
  .space .pt-steps { gap: 6px; margin-bottom: 18px; }
  .space .pt-steps li { border-top: 2px solid var(--p-line); font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--p-soft); padding-top: 8px; }
  .space .pt-steps li.on { border-top-color: var(--p-ink); color: var(--p-ink); }

  /* Étape photo */
  .space .teaser { background: var(--p-card); border: 1px solid var(--p-line); box-shadow: none; border-radius: 22px; padding: 8px; }
  .space .teaser figure { border-radius: 16px; height: 230px; }
  .space .teaser figcaption { font-size: 9.5px; letter-spacing: .14em; font-weight: 700; padding: 3px 8px; background: rgba(255,255,255,.85); backdrop-filter: blur(4px); }
  .space .teaser p { font-size: 13px; color: var(--p-soft); margin: 10px 4px 4px; }
  .space .teaser p b { color: var(--p-ink); font-weight: 600; }
  .space .tile { background: var(--p-card); border-radius: 22px; box-shadow: none; border: 1px solid var(--p-line); font: 600 13.5px/1.3 var(--sans); gap: 10px; color: var(--p-ink); }
  .space .tile .ico { width: 30px; height: 30px; stroke-width: 1.2; }
  .space .tile.dark { background: var(--p-ink); border-color: var(--p-ink); color: #FBF7F2; }

  /* Étape forme */
  .space .pt-q { font-weight: 500; font-size: 21px; margin-bottom: 6px; }
  .space .nails { gap: 8px; }
  .space .nail { background: var(--p-card); border: 1px solid var(--p-line); box-shadow: none; border-radius: 18px; padding: 14px 0 11px; }
  .space .nail svg path:not(.shine) { fill: #EFE4D8; stroke: var(--p-ink); stroke-width: .9; }
  .space .nail span { font-size: 11.5px; font-weight: 600; color: var(--p-ink); }
  .space button.nail.on { background: #F4ECE3; box-shadow: inset 0 0 0 1.5px var(--p-ink); }
  .space button.nail.on svg path:not(.shine) { fill: var(--p-gold); }
  .space .pt-label { font-size: 10px; font-weight: 700; letter-spacing: .16em; color: var(--p-soft); margin-top: 10px; }
  .space .pt-chips button { background: var(--p-card); border: 1px solid var(--p-line); font-weight: 500; padding: 8px 14px; }
  .space .pt-chips button.on { background: var(--p-ink); border-color: var(--p-ink); color: #FBF7F2; }

  /* ===================== V2 : couleur, émoticônes, barre du bas ===================== */

  .space[data-amb="lilas"] { --a1: #EEE9F6; --a2: #D5C9EA; --ac: #9C86C2; --circle: #F0EBF7; }

  /* Carte phare Photo test */

  .hero-txt { display: flex; flex-direction: column; gap: 3px; padding: 14px 16px 16px; }
  .hero-k { font-size: 10.5px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--p-ink); opacity: .75; }
  .hero-txt b { font-family: var(--serif); font-weight: 600; font-size: 21px; line-height: 1.15; }
  .hero-txt small { font-size: 12.5px; color: rgba(43,26,16,.7); }

  .home-label { margin: 22px 2px 10px; font-size: 10px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--p-soft); }
  .space .bubble .bem { width: 40px; height: 40px; border-radius: 14px; background: var(--circle); font-size: 20px; margin-bottom: 10px; }
  .space .bubble.big .bem { background: rgba(255,255,255,.14); }
  .space .badge { background: var(--ac); }
  /* Barre du bas de l'Espace Milky */
  .mbar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; display: grid; grid-template-columns: 1fr 1fr 84px 1fr 1fr; align-items: end; padding: 8px 8px 12px; background: rgba(255,255,255,.94); backdrop-filter: blur(12px); border-top: 1px solid var(--p-line); border-radius: 24px 24px 0 0; }
  .mbar[hidden] { display: none; }

  .mbar button.on .bem { filter: none; opacity: 1; }
  .mbar .mbar-main { margin-top: -30px; }
  .mbar .mbar-main .bem { width: 64px; height: 64px; border-radius: 50%; font-size: 28px; filter: none; opacity: 1; background: linear-gradient(140deg, var(--a2), var(--ac)); box-shadow: 0 0 0 5px #fff, 0 12px 22px -10px rgba(43,26,16,.7); }
  .mbar .mbar-main span { color: var(--p-ink); }
  .space .pt, .space .gal { padding-bottom: 110px; }

  /* Couleurs Dilerna + icônes maison */
  .space[data-amb="dilerna"] { --a1: #F3E9DE; --a2: #DCC4AA; --ac: #8E5E45; --circle: #F3E9DE; }

  .bem svg .f { fill: #EAD9C5; }
  .bem svg .c { fill: #B98A6E; }
  .hero-k .bem { width: 22px; height: 22px; vertical-align: -6px; }
  .hero-k .bem svg { width: 100%; height: 100%; }
  .space .bubble .bem { width: 42px; height: 42px; }
  .space .bubble.big .bem svg { stroke: #FBF7F2; }
  .space .bubble.big .bem svg .f { fill: rgba(251,247,242,.22); }
  .mbar button .bem { width: 28px; height: 28px; filter: grayscale(.5); opacity: .6; }
  .mbar button .bem svg { width: 100%; height: 100%; }
  .mbar button.on .bem { filter: none; opacity: 1; }
  .mbar .mbar-main .bem { width: 64px; height: 64px; background: linear-gradient(140deg, #DCC4AA, #8E5E45); }
  .mbar .mbar-main .bem svg { width: 50%; height: 50%; stroke: #FBF7F2; }
  .mbar .mbar-main .bem svg .f { fill: rgba(251,247,242,.3); }
  .mbar .mbar-main .bem svg .c { fill: #F3E3CF; }

  /* V3 : alerte créneaux, carte sans exemple, bouton Essayer -> 3 choix */
  .alert { width: 100%; display: flex; align-items: center; gap: 12px; border: 0; cursor: pointer; text-align: left; padding: 12px 14px; margin: 0 0 14px; border-radius: 20px; background: #2B1A10; color: #FBF7F2; font-family: var(--sans); box-shadow: 0 14px 26px -18px rgba(43,26,16,.9); }
  .alert-ico { position: relative; width: 40px; height: 40px; border-radius: 14px; background: rgba(251,247,242,.12); display: grid; place-items: center; flex: none; }
  .alert-ico .bem { width: 26px; height: 26px; }
  .alert-ico .bem svg { width: 100%; height: 100%; stroke: #FBF7F2; }
  .alert-ico .bem svg .f { fill: rgba(251,247,242,.22); }
  .alert-dot { position: absolute; top: -3px; right: -3px; width: 12px; height: 12px; border-radius: 50%; background: #D9A27E; box-shadow: 0 0 0 3px #2B1A10; animation: apulse 1.6s ease-out infinite; }
  @keyframes apulse { 0% { box-shadow: 0 0 0 3px #2B1A10, 0 0 0 3px rgba(217,162,126,.7); } 100% { box-shadow: 0 0 0 3px #2B1A10, 0 0 0 12px rgba(217,162,126,0); } }
  .alert-txt { flex: 1; display: grid; gap: 1px; }
  .alert-txt b { font-size: 14.5px; font-weight: 600; }
  .alert-txt small { font-size: 12px; color: rgba(251,247,242,.7); }
  .alert-go { padding: 7px 13px; border-radius: 999px; background: #F3E9DE; color: #2B1A10; font-size: 12px; font-weight: 700; }
  .hero-txt { padding: 20px 18px 18px; }
  .dial { position: absolute; inset: 0; z-index: 5; }
  .dial[hidden] { display: none; }
  .dial-bg { position: absolute; inset: 0; background: rgba(43,26,16,.35); backdrop-filter: blur(3px); animation: dfade .2s ease; }
  .dial-btns { position: absolute; left: 50%; bottom: 112px; transform: translateX(-50%); display: grid; gap: 10px; width: 230px; }
  .dial-btns button { display: flex; align-items: center; gap: 12px; border: 0; cursor: pointer; padding: 10px 16px 10px 10px; border-radius: 999px; background: #FBF7F2; color: #2B1A10; font: 600 14px var(--sans); box-shadow: 0 12px 24px -14px rgba(43,26,16,.8); animation: dup .25s cubic-bezier(.2,.9,.3,1.2) both; }
  .dial-btns button:nth-child(2) { animation-delay: .04s; }
  .dial-btns button:nth-child(3) { animation-delay: .08s; }
  .dial-btns .bem { width: 40px; height: 40px; border-radius: 50%; background: #F3E9DE; }
  @keyframes dup { from { opacity: 0; transform: translateY(18px) scale(.9); } }
  @keyframes dfade { from { opacity: 0; } }
  .mbar .mbar-main .bem { transition: transform .2s ease; }
  .mbar .mbar-main.open .bem { transform: rotate(-20deg) scale(1.05); }

  /* Variantes du bouton du milieu (A pilule, B carré doux, C ongle, D rond crème) */
  .mbar[data-btn] .mbar-main .bem { box-shadow: none; }
  .mbar[data-btn="A"] { grid-template-columns: 1fr 1fr 108px 1fr 1fr; align-items: center; }
  .mbar[data-btn="A"] .mbar-main { margin-top: 0; }
  .mbar[data-btn="A"] .mbar-main span { display: none; }
  .mbar[data-btn="A"] .mbar-main .bem { width: 100px; height: 46px; border-radius: 999px; background: #2B1A10; display: inline-flex; gap: 6px; justify-content: center; }
  .mbar[data-btn="A"] .mbar-main .bem svg { width: 20px; height: 20px; }
  .mbar[data-btn="A"] .mbar-main .bem::after { content: "Essayer"; font: 600 13px var(--sans); color: #FBF7F2; }
  .mbar[data-btn="B"] .mbar-main { margin-top: -26px; }

  .mbar[data-btn="B"] .mbar-main .bem svg { transform: rotate(-45deg); }
  .mbar[data-btn="B"] .mbar-main { gap: 10px; }
  .mbar[data-btn="C"] .mbar-main { margin-top: -40px; }
  .mbar[data-btn="C"] .mbar-main .bem { width: 54px; height: 74px; border-radius: 50% 50% 42% 42% / 64% 64% 36% 36%; background: linear-gradient(100deg, transparent 26%, rgba(255,255,255,.45) 32%, transparent 40%), linear-gradient(160deg, #E7CDB3, #A8735A); box-shadow: 0 0 0 5px #fff, 0 14px 22px -10px rgba(43,26,16,.75); }
  .mbar[data-btn="C"] .mbar-main .bem svg { width: 46%; height: 46%; margin-top: 10px; }
  .mbar[data-btn="D"] .mbar-main { margin-top: -24px; }
  .mbar[data-btn="D"] .mbar-main .bem { width: 58px; height: 58px; background: #FBF7F2; box-shadow: 0 0 0 1.5px #8E5E45, 0 0 0 6px #fff, 0 10px 20px -10px rgba(43,26,16,.6); }
  .mbar[data-btn="D"] .mbar-main .bem svg { stroke: #4E2E22; }
  .mbar[data-btn="D"] .mbar-main .bem svg .f { fill: #EAD9C5; }
  .mbar[data-btn="D"] .mbar-main .bem svg .c { fill: #B98A6E; }

  /* Bouton du milieu choisi : le B (losange) en rond */
  .mbar[data-btn="E"] .mbar-main { margin-top: -26px; gap: 10px; }
  .mbar[data-btn="E"] .mbar-main .bem { width: 60px; height: 60px; border-radius: 50%; background: #2B1A10; box-shadow: 0 0 0 5px #fff, 0 12px 20px -10px rgba(43,26,16,.8); }
  .mbar[data-btn="E"] .mbar-main .bem svg { width: 44%; height: 44%; stroke: #FBF7F2; }
  .mbar[data-btn="E"] .mbar-main .bem svg .f { fill: rgba(251,247,242,.25); }
  .mbar[data-btn="E"] .mbar-main .bem svg .c { fill: #D9B89A; }
  .mbar[data-btn="E"] .mbar-main.open .bem { transform: rotate(-20deg); }

  /* Roue du mois */
  .roue { position: absolute; inset: 0; z-index: 8; display: grid; place-items: center; }
  .roue[hidden] { display: none; }
  .roue-bg { position: absolute; inset: 0; background: rgba(43,26,16,.45); backdrop-filter: blur(4px); }
  .roue-card { position: relative; width: calc(100% - 32px); max-width: 340px; background: #FAF7F3; border-radius: 28px; padding: 22px 20px 18px; text-align: center; box-shadow: 0 24px 50px -20px rgba(43,26,16,.8); font-family: var(--sans); color: #2B1A10; }
  .roue-x { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(43,26,16,.15); background: transparent; font-size: 17px; cursor: pointer; color: #2B1A10; }
  .roue-k { margin: 0; font-size: 10px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: #8A7A70; }
  .roue-t { display: block; margin: 4px 0 14px; font-family: var(--serif); font-weight: 500; font-size: 23px; }
  .roue-wrap { position: relative; width: 240px; height: 240px; margin: 0 auto; }
  .roue-w { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; transition: transform 4.5s cubic-bezier(.15,.7,.12,1);
    background: conic-gradient(#F3E9DE 0 45deg, #DCC4AA 45deg 90deg, #F3E9DE 90deg 135deg, #8E5E45 135deg 180deg, #F3E9DE 180deg 225deg, #DCC4AA 225deg 270deg, #F3E9DE 270deg 315deg, #2B1A10 315deg 360deg);
    box-shadow: 0 0 0 6px #fff, 0 0 0 7px rgba(43,26,16,.15), 0 16px 30px -14px rgba(43,26,16,.7); }
  .roue-w span { position: absolute; left: 50%; top: 0; width: 0; height: 50%; transform-origin: 0 100%; }
  .roue-w em { position: absolute; top: 18px; left: 0; transform: translateX(-50%); font-style: normal; font-size: 11.5px; font-weight: 700; white-space: nowrap; color: #2B1A10; writing-mode: vertical-rl; text-orientation: mixed; }
  .roue-w span:nth-child(4) em, .roue-w span:nth-child(8) em { color: #FBF7F2; }
  .roue-pin { position: absolute; z-index: 2; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 11px solid transparent; border-right: 11px solid transparent; border-top: 20px solid #2B1A10; filter: drop-shadow(0 2px 2px rgba(0,0,0,.25)); }
  .roue-c { position: absolute; z-index: 2; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 46px; height: 46px; border-radius: 50%; background: #2B1A10; color: #F3E9DE; display: grid; place-items: center; font-family: var(--serif); font-size: 20px; box-shadow: 0 0 0 4px #fff; }
  .roue-res { min-height: 22px; margin: 16px 0 10px; font-size: 14px; font-weight: 600; color: #8A7A70; }
  .roue-res.win { color: #8E5E45; font-size: 15.5px; }
  .roue-card .cta { width: 100%; }
  .roue-card .cta:disabled { opacity: .55; }
  .roue-odds { display: block; margin-top: 10px; font-size: 10.5px; line-height: 1.4; color: #8A7A70; }

  .roue-t { font-family: var(--sans); font-weight: 800; font-size: 27px; letter-spacing: .06em; margin: 6px 0 4px; }
  .roue-sub { margin: 0 8px 16px; font-size: 13px; line-height: 1.4; color: #8A7A70; }
  .roue-c { width: 62px; height: 62px; background: none; box-shadow: 0 0 0 4px #fff, 0 6px 14px -6px rgba(43,26,16,.6); overflow: hidden; }
  .roue-c svg { width: 100%; height: 100%; display: block; }

  .roue-flacon { transform-box: fill-box; transform-origin: 50% 100%; animation: roueFlacon 2.4s ease-in-out infinite; }
  @keyframes roueFlacon { 0%, 100% { transform: rotate(0); } 15% { transform: rotate(-9deg); } 30% { transform: rotate(7deg); } 45% { transform: rotate(-4deg); } 60% { transform: rotate(0); } }

  /* Effets de gain de la roue */
  .roue-demo { margin: 12px 0 0; font-size: 10.5px; color: #8A7A70; display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; align-items: center; }
  .roue-demo button { border: 1px dashed rgba(43,26,16,.3); background: none; border-radius: 999px; padding: 3px 9px; font: 600 10.5px var(--sans); color: #2B1A10; cursor: pointer; }
  .confetti { position: absolute; inset: 0; z-index: 12; pointer-events: none; overflow: hidden; }
  .confetti i { position: absolute; top: -20px; border-radius: 2px; opacity: 0; animation-name: tombe; animation-timing-function: cubic-bezier(.3,.6,.5,1); animation-fill-mode: forwards; }
  @keyframes tombe { 0% { opacity: 1; transform: translateY(0) rotate(0); } 100% { opacity: .9; transform: translateY(880px) rotate(var(--r)); } }
  .gain { position: absolute; inset: 0; z-index: 11; display: grid; place-items: center; background: rgba(43,26,16,.35); backdrop-filter: blur(3px); }
  .gain[hidden] { display: none; }
  .gain-in { width: calc(100% - 56px); max-width: 300px; background: #FAF7F3; border-radius: 28px; padding: 26px 22px 20px; text-align: center; color: #2B1A10; font-family: var(--sans); box-shadow: 0 30px 60px -20px rgba(43,26,16,.9); animation: gainPop .55s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes gainPop { from { transform: scale(.4); opacity: 0; } }
  .gain-fl { display: block; width: 64px; height: 64px; margin: 0 auto 12px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 4px #fff; }
  .gain-fl svg { width: 100%; height: 100%; display: block; }
  .gain-k { margin: 0; font-size: 11px; font-weight: 800; letter-spacing: .24em; text-transform: uppercase; color: #8E5E45; }
  .gain-v { display: block; margin: 6px 0 4px; font-family: var(--serif); font-weight: 600; font-size: 54px; line-height: 1; }
  .gain-s { margin: 0 0 18px; font-size: 13.5px; line-height: 1.45; color: #8A7A70; }
  .gain-in .cta { width: 100%; }
  .gain-2 .gain-in { background: linear-gradient(160deg, #F3E9DE, #DCC4AA); }
  .gain-2 .gain-v { font-size: 64px; color: #8E5E45; animation: gainPulse 1.2s ease-in-out infinite; }
  @keyframes gainPulse { 50% { transform: scale(1.08); } }
  .gain-3 { background: rgba(43,26,16,.82); }
  .gain-3 .gain-in { background: #2B1A10; color: #FBF7F2; box-shadow: 0 0 0 1px rgba(217,184,154,.5), 0 0 60px rgba(217,184,154,.45); }
  .gain-3 .gain-fl { width: 92px; height: 92px; box-shadow: 0 0 0 4px #D9B89A, 0 0 30px rgba(217,184,154,.8); }
  .gain-3 .gain-k { color: #D9B89A; font-size: 12.5px; }
  .gain-3 .gain-v { font-size: 34px; line-height: 1.1; background: linear-gradient(90deg, #D9B89A, #FBF7F2, #D9B89A); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: brille 2s linear infinite; }
  @keyframes brille { to { background-position: -200% 0; } }
  .gain-3 .gain-s { color: rgba(251,247,242,.75); }
  .gain-3 .cta { background: #F3E9DE; color: #2B1A10; }

  .gain-screen { margin: -8px 0 16px; padding: 8px 12px; border-radius: 14px; background: rgba(142,94,69,.1); font-size: 13px; font-weight: 700; color: #8E5E45; }
  .gain-3 .gain-screen { background: rgba(217,184,154,.15); color: #D9B89A; }

  .per-day { font-style: normal; font-weight: 700; color: var(--ink); }
  .regles { margin: 18px 0 4px; border-top: 1px solid rgba(43,26,16,.12); padding-top: 10px; font-size: 11.5px; color: var(--ink-soft); }
  .regles summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 10.5px; }
  .regles summary::-webkit-details-marker { display: none; }
  .regles summary span { text-transform: none; letter-spacing: 0; text-decoration: underline; }
  .regles ul { margin: 8px 0 0; padding-left: 16px; line-height: 1.45; }
  .regles li { margin-bottom: 4px; }

  /* ===== V4 ===== */
  .inc-switch { display: flex; gap: 5px; align-items: center; justify-content: center; flex-wrap: wrap; margin: 10px 0 6px; font-size: 10.5px; color: var(--ink-soft); }
  .inc-switch button { border: 1px dashed rgba(43,26,16,.3); background: none; border-radius: 999px; padding: 3px 10px; font: 600 10.5px var(--sans); color: var(--ink); cursor: pointer; }
  .inc-switch button.on { background: var(--ink); color: #FBF7F2; border-style: solid; }
  .steps { display: grid; gap: 8px; margin: 6px 0 4px; }
  .step { border-radius: 18px; padding: 12px 14px; }
  .step-clear { background: linear-gradient(140deg, #E3ECEF, #C3D4DB); }
  .step-nude { background: linear-gradient(140deg, #F1DCCB, #DDB89B); }

  .step-h .check { width: 18px; height: 18px; border-radius: 50%; background: var(--ink); color: #fff; display: inline-grid; place-items: center; font-size: 11px; }
  .step ul { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; }
  .step li { font-size: 12.5px; display: flex; gap: 5px; align-items: center; }

  .qz-dur { display: inline-block; margin: 0 0 6px; padding: 4px 10px; border-radius: 999px; background: #2B1A10; color: #F3E3CF; font-size: 11.5px; font-weight: 700; }
  .qz-end { padding: 16px 10px 4px; }
  .clt { margin-top: 18px; border-top: 1px solid var(--p-line); padding-top: 14px; }
  .clt-t { margin: 0; text-align: center; font-family: var(--serif); font-size: 20px; }
  .clt-sub { margin: 4px 0 10px; text-align: center; font-size: 12px; color: var(--p-soft); }
  .pod { display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: end; gap: 6px; margin: 8px 0 12px; }

  .pod-1 .pod-b { height: 84px; background: linear-gradient(160deg, #8E5E45, #2B1A10); }
  .pod-2 .pod-b { height: 62px; background: #B98A6E; }
  .pod-3 .pod-b { height: 46px; background: #DCC4AA; color: #2B1A10; }

  .clt-l { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .clt-l li { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--p-line); border-radius: 14px; padding: 9px 12px; font-size: 13px; }
  .clt-l li b { color: var(--p-soft); }
  .clt-l li small { color: var(--p-soft); font-size: 11.5px; }
  .clt-l li.moi { border-color: #8E5E45; background: #F3E9DE; font-weight: 700; }

  .couronne { width: 15px; height: 15px; vertical-align: -2px; }

  .clt-nu { list-style: none; margin: 8px 0 10px; padding: 0; display: grid; gap: 6px; }
  .clt-nu li { display: grid; grid-template-columns: 46px 1fr auto; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; padding: 4px 8px 4px 4px; border-radius: 16px; }
  .clt-nu li i { height: 30px; border-radius: 15px 15px 6px 6px; box-shadow: inset 0 -6px 8px rgba(0,0,0,.08), inset 0 0 0 1px rgba(43,26,16,.1); position: relative; }
  .clt-nu li i::after { content: ''; position: absolute; left: 8px; top: 5px; width: 6px; height: 12px; border-radius: 4px; background: rgba(255,255,255,.4); }
