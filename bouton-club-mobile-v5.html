  /* Le flacon parfait */
  .fl-zone { position: relative; height: 330px; border-radius: 22px; overflow: hidden; background: linear-gradient(180deg, #FBF7F2, #F3E9DE); box-shadow: inset 0 0 0 1px rgba(43,26,16,.08); display: grid; place-items: center; }

  .fl-stop { font-size: 18px; letter-spacing: .08em; }

  .jx-msg .fete, .drop-start .fete { width: 18px; height: 18px; vertical-align: -3px; }
  /* Les mots mêlés */
  .jx-i6 { grid-template-columns: 15px 15px; gap: 3px; place-content: center; }
  .jx-i6 i { width: 15px; height: 15px; border-radius: 3px; background: #fff; color: #2B1A10; font: 700 9px var(--sans); font-style: normal; display: grid; place-items: center; }
  .jx-i6 i:nth-child(1), .jx-i6 i:nth-child(2) { background: #8E5E45; color: #fff; }
  .mm-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; touch-action: none; user-select: none; -webkit-user-select: none; }
  .mm-c { aspect-ratio: 1; border-radius: 8px; background: #fff; display: grid; place-items: center; font: 700 15px var(--sans); color: #2B1A10; box-shadow: inset 0 0 0 1px rgba(43,26,16,.08); transition: background .15s; }
  .mm-c.f { background: #DCC4AA; }
  .mm-c.sel { background: #8E5E45; color: #fff; }
  .mm-mots { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 14px 0 12px; }
  .mm-mots span { background: #fff; border: 1px solid var(--p-line); border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 700; letter-spacing: .04em; }
  .mm-mots span.ok { text-decoration: line-through; color: var(--p-soft); background: #F3E9DE; }
  /* Le strass sauteur */
  .ss { position: absolute; left: 57px; top: 187px; width: 26px; height: 26px; z-index: 1; }
  .ss-lime { position: absolute; width: 34px; border-radius: 10px; border: 1.5px solid #2B1A10; box-sizing: border-box; background: radial-gradient(rgba(43,26,16,.22) 1px, transparent 1.5px) 0 0 / 6px 6px, linear-gradient(90deg, #C99A7C, #B98A6E 60%, #A87358); }

  .ss-ps { height: 50px; border-radius: 16px; border: 1px solid rgba(43,26,16,.2); padding: 0 16px; font: 600 16px var(--sans); text-align: center; margin: 6px 0 0; }
  .ss-ps[hidden] { display: none; }

  /* Classement à la fin des jeux */
  .drop-start.clt-on { place-content: center stretch; padding: 14px 16px; gap: 6px; overflow: auto; }
  .fl-zone:has(.clt-on) { height: 450px; }
  .jx-clt-t { margin: 8px 0 2px; font-size: 12px; color: var(--p-soft); }

  .jx-clt .clt-nu { margin: 4px 0 8px; gap: 4px; text-align: left; }

  [data-mm-ps][hidden], .mm-grid[hidden], .mm-mots[hidden], .jx-msg[hidden] { display: none; }
  [data-clt-mm]:not(:empty) { margin-bottom: 4px; }

  /* Photo test : la galerie sous les 2 carrés */
  .ptg { margin-top: 22px; }
  .ptg[hidden], .ptg.vide { display: none; }
  .ptg-t { margin: 0 0 10px; font: 600 18px var(--serif); }
  .ptg-t span { font: 500 12px var(--sans); color: var(--p-soft); }
  /* Accueil : mes derniers essais */
  .last { margin-top: 18px; }
  .last[hidden] { display: none; }
  .last-h { display: flex; align-items: baseline; justify-content: space-between; }
  .last-all { border: 0; background: none; font: 600 12.5px var(--sans); color: #8E5E45; cursor: pointer; padding: 0; }
  .last-imgs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .last-i { border: 0; padding: 0; border-radius: 14px; overflow: hidden; aspect-ratio: 3 / 4; cursor: pointer; background: #F3E9DE; box-shadow: inset 0 0 0 1px rgba(43,26,16,.08); }
  .last-i img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* En-tête qui se replie en douceur quand on fait défiler (--k va de 0 à 1) */
  .space { --k: 0; }
  .space .space-top { padding-top: calc(30px - 16px * var(--k)); transition: padding .18s ease-out; }
  .space .space-crown { height: calc(24px * (1 - var(--k))); opacity: calc(1 - 1.6 * var(--k)); transition: height .18s ease-out, opacity .18s ease-out; }
  .space .space-kicker { max-height: calc(16px * (1 - var(--k))); margin-top: calc(6px * (1 - var(--k))); opacity: calc(1 - 1.8 * var(--k)); overflow: hidden; transition: max-height .18s ease-out, margin .18s ease-out, opacity .18s ease-out; }
  .space .space-top h2 { font-size: calc(27px - 9px * var(--k)); margin-top: calc(4px * (1 - var(--k))); transition: font-size .18s ease-out, margin .18s ease-out; }
  .space .space-top .close { top: calc(12px - 4px * var(--k)); transition: top .18s ease-out; }

  /* L'écran ne bouge plus sur les côtés : seulement en haut / en bas */
  html, body { overflow-x: hidden; }
  .space, .space-home, .space .pt, .space .gal, .space .sp { overflow-x: hidden; overscroll-behavior-x: none; }
  .space-home, .space .pt, .space .gal, .space .sp { touch-action: pan-y; overscroll-behavior: none; }

  /* Barre du haut des écrans : titre au centre, compteur à droite, rien ne dépasse */
  .space .pt-bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
  .space .pt-bar > :first-child { justify-self: start; }
  .space .pt-bar b { margin-right: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 190px; }
  .space .pt-count { justify-self: end; min-width: 0; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }

  /* Vrai téléphone : l'écran ne zoome pas et ne part jamais sur les côtés, il défile seulement en haut / en bas */
  html.real-phone, html.real-phone body { overflow: hidden; overscroll-behavior: none; touch-action: pan-y; width: 100%; height: 100%; }
  html.real-phone .phone { width: 100%; height: 100vh; height: 100dvh; }
  html.real-phone .fit { height: 100vh; height: 100dvh; }
  html.real-phone input, html.real-phone textarea, html.real-phone select { font-size: 16px; }
  .space button, .space a, .space label { touch-action: manipulation; }

  /* Carte membre (Mon abonnement) */
  .mcard { position: relative; overflow: hidden; aspect-ratio: 1.586; border-radius: 22px; padding: 18px 20px; margin-bottom: 12px; display: grid; grid-template-rows: auto 1fr auto; text-align: center;
    background: linear-gradient(150deg, #4A2E1F, #1E120B); color: #F3E3CF; box-shadow: 0 18px 30px -18px rgba(30,18,11,.8); }
  .mcard[data-tier="ambre"] { background: linear-gradient(150deg, #8E5E45 0%, #B98A4E 55%, #6B4A2B 100%); color: #FFF6E8; }
  .mcard[data-tier="or"] { background: linear-gradient(150deg, #F3DFA2 0%, #D4AF5F 45%, #B38B3C 75%, #E6CC85 100%); color: #3B2610; }
  .mc-shine { position: absolute; inset: -40% -60%; background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,.18) 50%, transparent 60%); pointer-events: none; }
  .mcard[data-tier="or"] .mc-shine { background: linear-gradient(115deg, transparent 38%, rgba(255,255,255,.45) 50%, transparent 62%); }
  .mc-top { display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 11px; font-weight: 700; letter-spacing: .26em; text-transform: uppercase; }
  .mc-crown { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linejoin: round; }
  .mc-nom { align-self: center; font: 500 26px/1.15 var(--serif); letter-spacing: .02em; }
  .mc-bot { display: flex; justify-content: space-between; align-items: flex-end; text-align: left; gap: 8px; }
  .mc-bot small { display: block; font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; opacity: .7; }
  .mc-bot b { font: 600 13px var(--sans); }
  .mc-tier { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,.14); white-space: nowrap; }
  .mcard[data-tier="or"] .mc-tier { background: rgba(59,38,16,.12); }
  .abo-info { list-style: none; margin: 0 0 10px; padding: 4px 14px; background: #fff; border: 1px solid var(--p-line); border-radius: 18px; font-size: 13px; }
  .abo-info li { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid var(--p-line); }
  .abo-info li:first-child { border-top: 0; }
  .abo-info small { color: var(--p-soft); font-size: 12.5px; }
  .abo-info span { text-align: right; font-weight: 600; }
  /* La croix pour fermer : en haut à droite */
  .close { left: auto; right: 12px; }

  /* Memory : dos des cartes = le joli flacon de la roue */
  .mc-back .mc-fl { width: 42%; height: auto; filter: drop-shadow(0 4px 8px rgba(0,0,0,.35)); }

  .space .emo-m { filter: grayscale(1) sepia(.75) saturate(1.15) brightness(.8); }
  .emo .ico-fl { display: inline-block; vertical-align: -4px; }

  /* Revenir sans flèche : les flèches ‹ disparaissent */
  html[data-retour] .space .pt-back { visibility: hidden; }
  /* Version 3 : carte au milieu */
  .sp-shade { position: absolute; inset: 0; z-index: 5; background: rgba(250,247,243,.45); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); animation: dfade .2s ease; }
  .sp-shade[hidden] { display: none; }
  html[data-retour="3"] .space .sp { position: absolute; top: 96px; left: 18px; right: 18px; bottom: 104px; z-index: 6; background: #FAF7F3; border-radius: 26px; padding: 12px 14px 20px !important; box-shadow: 0 24px 60px -12px rgba(30,18,11,.45), 0 0 0 1px rgba(43,26,16,.06); animation: carteIn .28s cubic-bezier(.2,1.2,.4,1); }
  @keyframes carteIn { from { opacity: 0; transform: scale(.88); } to { opacity: 1; transform: scale(1); } }

  /* Version 2 : petite poignée en haut des écrans, pour montrer qu'on peut tirer vers le bas */
  html[data-retour="2"] .space .sp::before, html[data-retour="2"] .space .pt::before, html[data-retour="2"] .space .gal::before { content: ""; display: block; width: 42px; height: 5px; border-radius: 5px; background: #DCC4AA; margin: 6px auto 4px; }

  /* En-tête dans la page : il défile avec le doigt (aussi fluide que la page), la petite barre reste en haut */
  .space:not(:has(.space-lock:not([hidden]))) > .space-top { display: none; }
  .space .space-home, .space .pt, .space .gal { padding-top: 0; }
  .hd { display: contents; }
  .hd-mini { position: sticky; top: 0; z-index: 7; height: 48px; margin: 0 -16px -48px; padding: 0 16px; display: flex; align-items: center; justify-content: center; transition: background-color .2s, box-shadow .2s; }
  .hd-mini b { font: 500 17px var(--serif); color: var(--p-ink); opacity: 0; transition: opacity .2s; }
  .hd.on .hd-mini { background: rgba(250,247,243,.94); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: 0 1px 0 var(--p-line); }
  .hd.on .hd-mini b { opacity: 1; }
  .hd-x { position: absolute; right: 12px; top: 6px; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--p-line); background: rgba(250,247,243,.8); font-size: 17px; color: var(--p-ink); cursor: pointer; }
  .hd-big { text-align: center; padding: 30px 0 6px; }
  .hd-crown { width: 24px; height: 24px; fill: none; stroke: var(--p-ink); stroke-width: 1.2; stroke-linejoin: round; }
  .hd-kick { margin: 6px 0 0; font-size: 10px; font-weight: 600; letter-spacing: .26em; text-transform: uppercase; color: var(--p-soft); }
  .hd-title { margin: 4px 0 0; font: 500 27px var(--serif); letter-spacing: .01em; color: var(--p-ink); }
  /* Photo test : directement la petite barre, pour tout voir sans descendre */
  [data-pt] > .hd .hd-big { display: none; }
  [data-pt] > .hd .hd-mini { margin-bottom: 0; background: rgba(250,247,243,.94); box-shadow: 0 1px 0 var(--p-line); }
  [data-pt] > .hd .hd-mini b { opacity: 1; }
  /* la petite poignée « tirer vers le bas » passe juste sous la barre */
  html[data-retour="2"] .space .sp::before, html[data-retour="2"] .space .pt::before, html[data-retour="2"] .space .gal::before { display: none; }
  html[data-retour="2"] .space .sp > .hd .hd-mini::after, html[data-retour="2"] .space .gal > .hd .hd-mini::after { content: ""; position: absolute; top: 4px; left: 50%; width: 42px; height: 5px; margin-left: -21px; border-radius: 5px; background: #DCC4AA; }

  /* Petit bonhomme « Mon compte » en haut à gauche */
  .hd-me { position: absolute; left: 12px; top: 6px; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--p-line); background: rgba(250,247,243,.8); display: grid; place-items: center; cursor: pointer; padding: 0; }
  .hd-me svg { width: 19px; height: 19px; fill: none; stroke: #4E2E22; stroke-width: 1.5; stroke-linecap: round; }
  .hd-sub { margin: 4px 0 0; font-size: 13px; color: var(--p-soft); }
  /* Mon compte */
  .cp-head { display: grid; justify-items: center; gap: 4px; text-align: center; padding: 6px 0 16px; }
  .cp-av { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(150deg, #F3E9DE, #DCC4AA); display: grid; place-items: center; font: 500 28px var(--serif); color: #4E2E22; margin-bottom: 4px; }
  .cp-head b { font: 500 20px var(--serif); }
  .cp-head small { color: var(--p-soft); font-size: 12.5px; }

  .cp-list > li:first-child { border-top: 0; }

  .cp-list li.cp-form { display: grid; grid-template-columns: 1fr; justify-content: stretch; gap: 8px; border-top: 0; padding-top: 0; }
  .cp-form .cta { width: 100%; }
  .cp-form input { width: 100%; box-sizing: border-box; height: 46px; border-radius: 14px; border: 1px solid rgba(43,26,16,.2); padding: 0 14px; font: 500 16px var(--sans); }
  .cp-msg { margin: 0; font-size: 12.5px; color: #8E5E45; min-height: 16px; }
  .cp-go { cursor: pointer; }
  .cp-go i { font-style: normal; font-size: 20px; color: var(--p-soft); }

  .slot.mine { background: #F3E9DE; }
  .slot-tag.mine-tag { background: #8E5E45; color: #fff; padding: 6px 10px; border-radius: 999px; white-space: nowrap; }

  /* « Les jeux » : grande case au milieu, sur toute la largeur */
  .space .bubble.jeux-big { grid-column: 1 / -1; display: grid; justify-items: center; text-align: center; padding: 20px 16px 18px; background: linear-gradient(150deg, #FFFFFF, #F3E9DE); }

  .space .bubble.jeux-big b { font: 500 20px var(--serif); }
  .space .bubble.jeux-big small { font-size: 13px; }
  /* « Mon abonnement » : en ligne, sur toute la largeur (pour que la grille tombe juste) */
  .space .bubble.abo-row { grid-column: 1 / -1; display: grid; grid-template-columns: auto 1fr; column-gap: 12px; align-items: center; }
  .space .bubble.abo-row .bem { grid-row: span 2; margin: 0; }

  /* Ma cagnotte */
  .cg-card { text-align: center; border-radius: 24px; padding: 20px; background: linear-gradient(150deg, #F3E9DE, #DCC4AA 70%, #C9A88B); color: #2B1A10; margin-bottom: 12px; display: grid; gap: 2px; }
  .cg-card small { font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: rgba(43,26,16,.6); }
  .cg-card b { font: 500 44px var(--serif); line-height: 1.1; }
  .cg-card span { font-size: 13px; color: rgba(43,26,16,.75); }
  .cg-plus { color: #8E5E45; } .cg-moins { color: var(--p-soft); }
  .cta:disabled { opacity: .45; }

  /* Inscription au club */

  .onb-x { position: absolute; right: 14px; top: 12px; width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(43,26,16,.12); background: #fff; font-size: 17px; cursor: pointer; }
  .onb-crown { width: 26px; height: 26px; margin: 0 auto; fill: none; stroke: #2B1A10; stroke-width: 1.2; stroke-linejoin: round; }

  .onb-s { margin: 0 0 6px; font-size: 13.5px; color: #8A7A70; }

  .onb-f { display: grid; gap: 5px; text-align: left; font-size: 12.5px; font-weight: 600; color: #4E2E22; }
  .onb-f i { font-weight: 400; color: #8A7A70; font-style: normal; }
  .onb-f input { width: 100%; box-sizing: border-box; height: 48px; border-radius: 14px; border: 1px solid rgba(43,26,16,.18); background: #fff; padding: 0 14px; font: 500 16px var(--sans); color: #2B1A10; }
  .onb-err { margin: 0; min-height: 16px; font-size: 12.5px; color: #8A3B2E; }
  .onb-pay { height: 52px; border-radius: 999px; font: 600 15.5px var(--sans); cursor: pointer; }
  .onb-pay.apple { background: #000; color: #fff; border: 0; }
  .onb-pay.carte { background: #fff; color: #2B1A10; border: 1px solid rgba(43,26,16,.25); }
  .onb-note { margin: 4px 0 0; font-size: 11.5px; color: #8A7A70; line-height: 1.5; }
  .onb-demo { font-style: normal; opacity: .8; }
  .onb-spin { width: 46px; height: 46px; margin: 0 auto 8px; border-radius: 50%; border: 3px solid #DCC4AA; border-top-color: #8E5E45; animation: onbTourne .9s linear infinite; }

  @keyframes onbTourne { to { transform: rotate(360deg); } }
  .onb-list { list-style: none; margin: 6px 0 10px; padding: 0; display: grid; gap: 8px; text-align: left; }
  .onb-list li { background: #fff; border: 1px solid rgba(43,26,16,.08); border-radius: 16px; padding: 12px 14px; font-size: 13px; color: #8A7A70; }
  .onb-list li b { display: block; color: #2B1A10; font-size: 14px; margin-bottom: 2px; }
  .onb .cta { width: 100%; }

  .space-lock input[type="email"] { text-transform: none; letter-spacing: 0; font: 500 16px var(--sans); }
  .space-lock [hidden] { display: none !important; }
  .lock-s { color: var(--p-soft, #8A7A70); font-size: 13px; margin-top: -4px; }
  .lock-lien { display: grid; gap: 6px; padding: 14px; border-radius: 18px; background: #F3E9DE; text-align: center; }
  .lock-lien b { font-size: 15px; } .lock-lien span { font-size: 13px; color: #8A7A70; }
  .lock-ouvrir { margin-top: 4px; border: 0; background: #2B1A10; color: #FBF7F2; border-radius: 999px; padding: 10px 14px; font: 600 13px var(--sans); cursor: pointer; }

  /* Bienvenue : la couronne arrive, des petites étincelles, puis le bouton */
  .onb-bienvenue { gap: 18px; }
  .onb-anim { position: relative; width: 120px; height: 120px; margin: 0 auto; display: grid; place-items: center; }
  .onb-crown2 { width: 76px; height: 76px; fill: #F3E9DE; stroke: #8E5E45; stroke-width: 1.1; stroke-linejoin: round; animation: onbPop .8s cubic-bezier(.2,1.5,.4,1) both, onbFlotte 2.6s ease-in-out .8s infinite; }
  .onb-anim i { position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px; border-radius: 50%; background: #B98A6E; opacity: 0; animation: onbEtincelle 1.4s ease-out .5s both; }
  .onb-anim i:nth-child(2) { --x: -52px; --y: -38px; background: #DCC4AA; }
  .onb-anim i:nth-child(3) { --x: 54px; --y: -30px; }
  .onb-anim i:nth-child(4) { --x: -46px; --y: 40px; background: #8E5E45; width: 6px; height: 6px; }
  .onb-anim i:nth-child(5) { --x: 48px; --y: 44px; background: #DCC4AA; }
  .onb-anim i:nth-child(6) { --x: 0px; --y: -62px; background: #8E5E45; width: 6px; height: 6px; }
  .onb-anim i:nth-child(7) { --x: 2px; --y: 60px; }
  @keyframes onbPop { from { opacity: 0; transform: scale(.3) rotate(-14deg); } to { opacity: 1; transform: none; } }
  @keyframes onbFlotte { 50% { transform: translateY(-6px) rotate(-3deg); } }
  @keyframes onbEtincelle { 0% { opacity: 0; transform: translate(0, 0) scale(.4); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--x), var(--y)) scale(1); } }
  .onb-bienvenue .onb-t { font-size: 28px; animation: onbMonte .6s ease-out .45s both; }
  .onb-bienvenue .cta { animation: onbMonte .6s ease-out 1s both; }
  @keyframes onbMonte { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .onb-form { display: grid; gap: 10px; }
  .deja { margin: 6px 0 0; text-align: center; font-size: 12px; color: var(--ink-soft, #8A7A70); }
  .deja a { color: inherit; font-weight: 700; }
  .deja { position: relative; display: flex; align-items: center; justify-content: center; gap: 4px; min-height: 44px; margin: 10px 0 0; padding: 0 16px; border-radius: 999px; background: #fff; box-shadow: 0 0 0 1.5px rgba(33,2,2,.15); font-size: 13px; color: #4E2E22; }
  .deja a { text-decoration: none; }
  .deja a::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
  .onb-fl.ok { animation: onbPop .6s cubic-bezier(.2,1.5,.4,1) both; }

  /* Bienvenue : rayons dorés qui tournent + étoiles + grand flacon marron */
  .onb-bienvenue { position: relative; overflow: hidden; }
  .onb-ray { position: absolute; z-index: 0; left: 50%; top: calc(50% - 80px); width: 600px; height: 600px; margin: -300px; border-radius: 50%; pointer-events: none;
    background: repeating-conic-gradient(rgba(201,162,78,.30) 0 8deg, transparent 8deg 20deg);
    -webkit-mask: radial-gradient(circle, #000 12%, transparent 62%); mask: radial-gradient(circle, #000 12%, transparent 62%);
    animation: onbRayIn 1.2s ease-out both, onbTourneLent 18s linear infinite; }
  @keyframes onbRayIn { from { opacity: 0; scale: .4; } to { opacity: 1; scale: 1; } }
  @keyframes onbTourneLent { to { rotate: 360deg; } }
  .onb-etoiles { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
  .onb-etoiles i { position: absolute; opacity: 0; animation: onbScintille 1.4s ease-in-out infinite both; }
  .onb-etoiles svg { width: 100%; height: 100%; display: block; }
  @keyframes onbScintille { 0%, 100% { opacity: 0; transform: scale(0) rotate(0); } 50% { opacity: 1; transform: scale(1) rotate(45deg); } }
  .onb-flacon { position: relative; z-index: 2; width: 92px; height: 148px; margin: 0 auto; filter: drop-shadow(0 14px 18px rgba(43,26,16,.3));
    animation: onbPop .9s cubic-bezier(.2,1.5,.4,1) both, onbFlotte 2.8s ease-in-out .9s infinite; transform-origin: 50% 100%; }
  .onb-bienvenue .onb-t, .onb-bienvenue .cta { position: relative; z-index: 2; }

  .onb-fl, .onb-flacon { justify-self: center; }
  .onb-fl { margin: 0 auto 8px; }
  /* petits flacons autour du grand */
  .onb-petits { position: absolute; z-index: 1; left: 50%; top: calc(50% - 80px); width: 0; height: 0; pointer-events: none; }
  .onb-pf { position: absolute; left: 0; top: 0; translate: calc(var(--dx) - 50%) calc(var(--dy) - 50%); rotate: var(--r); opacity: 0; filter: drop-shadow(0 6px 8px rgba(43,26,16,.2));
    animation: onbPfIn .7s cubic-bezier(.2,1.6,.4,1) both, onbPfFlotte 3s ease-in-out infinite; }
  .onb-pf svg { width: 100%; height: 100%; display: block; }
  @keyframes onbPfIn { from { opacity: 0; scale: 0; } to { opacity: 1; scale: 1; } }
  @keyframes onbPfFlotte { 50% { transform: translateY(-7px) rotate(6deg); } }

  /* Louise qui se balade en bas avec son sac à dos plein de flacons */
  .onb-louise { position: absolute; left: 0; right: 0; bottom: 34px; height: 64px; z-index: 2; pointer-events: none; }
  .onb-louise::after { content: ""; position: absolute; left: 10%; right: 10%; bottom: -2px; height: 1px; background: rgba(43,26,16,.08); }
  .lw { position: absolute; bottom: 0; left: -110px; width: 100px; height: 66px; animation: lwMarche 14s linear 1.4s infinite; }
  .lw svg { width: 100%; height: 100%; overflow: visible; }
  .lw-corps { animation: lwBob .32s ease-in-out infinite alternate; }
  .lw-p { transform-box: fill-box; transform-origin: 50% 0; animation: lwPatte .32s ease-in-out infinite alternate; }
  .lw-b { animation-direction: alternate-reverse; }
  @keyframes lwMarche { 0% { left: -110px; transform: scaleX(1); } 47% { left: calc(100% + 10px); transform: scaleX(1); } 50% { left: calc(100% + 10px); transform: scaleX(-1); } 97% { left: -110px; transform: scaleX(-1); } 100% { left: -110px; transform: scaleX(1); } }
  @keyframes lwBob { to { transform: translateY(-1.5px); } }
  @keyframes lwPatte { from { transform: rotate(22deg); } to { transform: rotate(-22deg); } }

  /* Le conseil du jour */
  .tip { width: 100%; margin-top: 14px; border: 0; cursor: pointer; text-align: left; display: grid; gap: 4px; padding: 16px 16px 14px; border-radius: 22px; background: linear-gradient(150deg, #FFFFFF, #F3E9DE); box-shadow: inset 0 0 0 1px var(--p-line); font-family: var(--sans); color: var(--p-ink); }
  .tip-k { font-size: 10.5px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: #8E5E45; }
  .tip b { font: 500 18px/1.25 var(--serif); }
  .tip small { font-size: 13px; line-height: 1.45; color: var(--p-soft); }

  .soin-l { display: grid; gap: 8px; margin-bottom: 8px; }
  .soin { background: #fff; border: 1px solid var(--p-line); border-radius: 18px; padding: 13px 14px; }
  .soin b { display: block; font-size: 14.5px; margin-bottom: 3px; }
  .soin p { margin: 0; font-size: 13px; line-height: 1.45; color: var(--p-soft); }

  .soin-auj { display: inline-block; margin-bottom: 6px; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #fff; background: #8E5E45; border-radius: 999px; padding: 3px 9px; }

  .lw { animation: none !important; }

  .lw.regarde .lw-profil { display: none; }

  .lw-drop { position: absolute; top: 0; width: 7px; height: 17px; z-index: 1; }
  .lw-drop svg { width: 100%; height: 100%; display: block; }

  /* Conseil de la semaine : une case en ligne, juste avant les jeux, pas cliquable */
  .space .bubbles .tip { grid-column: 1 / -1; margin: 0; cursor: default; display: grid; grid-template-columns: 52px 1fr; gap: 14px; align-items: center; padding: 18px 16px; min-height: 118px; box-sizing: border-box; }
  .tip-ico { width: 52px; height: 64px; display: grid; place-items: center; border-radius: 16px; background: rgba(255,255,255,.7); }
  .tip-ico svg { width: 26px; height: 42px; }

  /* Non-membres : l'aperçu flou + l'essai offert */
  .tz { flex: 1; overflow-y: auto; overscroll-behavior: none; padding: 26px 16px 30px; display: grid; gap: 12px; align-content: start; position: relative; }
  .tz[hidden] { display: none; }
  .tz-x { position: absolute; right: 12px; top: 12px; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--p-line); background: rgba(250,247,243,.85); font-size: 17px; color: var(--p-ink); cursor: pointer; z-index: 3; }
  .tz-top { text-align: center; }
  .tz-top svg { width: 24px; height: 24px; fill: none; stroke: var(--p-ink); stroke-width: 1.2; stroke-linejoin: round; }
  .tz-top p { margin: 6px 0 0; font-size: 10px; font-weight: 600; letter-spacing: .26em; text-transform: uppercase; color: var(--p-soft); }
  .tz-top b { display: block; margin-top: 4px; font: 500 26px var(--serif); }

  .tz-flou .d { background: #2B1A10; } .tz-flou .b { background: linear-gradient(140deg, #F3E9DE, #DCC4AA); } .tz-flou .w { grid-column: 1 / -1; height: 64px; background: linear-gradient(150deg, #fff, #F3E9DE); }
  .tz-cad { position: absolute; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: rgba(250,247,243,.95); box-shadow: 0 4px 10px rgba(43,26,16,.2); }
  .tz-cad svg { width: 15px; height: 15px; fill: none; stroke: #2B1A10; stroke-width: 1.6; stroke-linecap: round; }
  .tz-card { position: relative; margin-top: -150px; background: #fff; border-radius: 22px; padding: 16px; box-shadow: 0 16px 30px -16px rgba(43,26,16,.45); display: grid; gap: 10px; }

  .tz-t { margin: 6px 0 0; font: 500 18px/1.25 var(--serif); }
  .tz-av { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 13px; }
  .tz-av li { display: flex; gap: 8px; align-items: center; }
  .tz-av li i { width: 24px; height: 24px; border-radius: 8px; background: #F3E9DE; display: grid; place-items: center; font-style: normal; font-size: 12px; flex: none; }
  .tz .cta { width: 100%; }
  .tz .cta.light { background: #fff; color: var(--p-ink); box-shadow: inset 0 0 0 1px rgba(43,26,16,.22); }
  .tz .cta[hidden] { display: none; }
  .tz-note { margin: 0; text-align: center; font-size: 11.5px; color: var(--p-soft); }
  .tz-note a { color: inherit; font-weight: 700; }
  .tz-note a[data-tz-deja] { display: flex; align-items: center; justify-content: center; min-height: 44px; margin-top: 4px; padding: 0 16px; border-radius: 999px; background: #fff; box-shadow: 0 0 0 1.5px rgba(33,2,2,.15); font-size: 13px; color: #4E2E22; text-decoration: none; }
  /* pendant l'essai offert : pas de galerie ni d'enregistrement, pas de barre du bas */
  .space.essai .ptg, .space.essai [data-save], .space.essai .rs-btns, .space.essai .rs-btns-c, .space.essai .hd-me { display: none !important; }
  .essai-fin { margin-top: 14px; text-align: center; background: #F3E9DE; border-radius: 20px; padding: 16px; display: grid; gap: 8px; }
  .essai-fin[hidden] { display: none; }
  .essai-fin b { font: 500 20px var(--serif); } .essai-fin p { margin: 0; font-size: 13px; color: var(--p-soft); }
  .sheet .blob { display: none; }   /* plus de rond décoratif en haut à droite de la fiche */

  /* Louise de face : on cache le cou et le collier de profil */
  .lw.regarde .lw-cou { display: none; }
  /* Fiche : Louise en haut de la carte « Club privé », elle pousse un flacon */
  .fi-lou { position: relative; height: 56px; margin: 0 0 -10px; overflow: hidden; pointer-events: none; }
  .fi-lou .lw { top: 0; bottom: auto; left: 0; transform: translateX(-110px); }
  .fi-fl { position: absolute; top: 35px; width: 13px; height: 21px; transform-origin: 50% 80%; }
  /* quand Louise fait demi-tour, « Dilerna » reste à l'endroit */

  .lw.dos .lw-txt { transform: scaleX(-1); }

  /* Essai offert : l'e-mail d'abord */

  .tz-form[hidden] { display: none; }
  .tz-form > b { font: 500 17px var(--serif); text-align: center; }
  .tz-form input[type=email] { width: 100%; box-sizing: border-box; font-size: 16px; padding: 13px 14px; border-radius: 14px; border: 1px solid rgba(43,26,16,.2); background: #fff; color: var(--p-ink); font-family: var(--sans); }
  .tz-ok { display: flex; gap: 9px; align-items: flex-start; font-size: 12px; line-height: 1.4; color: var(--p-soft); cursor: pointer; }
  .tz-ok input { flex: none; width: 18px; height: 18px; margin: 1px 0 0; accent-color: #8E5E45; }

  .tz-info { margin: 0; font-size: 11.5px; line-height: 1.4; color: var(--p-soft); text-align: center; }
  .tz-info a { color: inherit; }
  .tz-info a { display: block; white-space: nowrap; margin-top: 2px; }

  /* L'horoscope des ongles */
  .space .bubble.horo-tuile { grid-column: 1 / -1; display: grid; grid-template-columns: 46px 1fr 14px; gap: 12px; align-items: center; text-align: left; background: linear-gradient(150deg, #FFFFFF, #F3E9DE); }

  .horo-z .date { display: grid; grid-template-columns: 1fr 1.5fr; gap: 8px; margin-bottom: 12px; }

  .horo-z .cta { width: 100%; box-sizing: border-box; white-space: normal; }

  .horo-z .res > *, .horo-z .rub > div > div { min-width: 0; }
  @keyframes hzMonte { from { opacity: 0; transform: translateY(10px); } }
  .horo-z .signe { display: flex; gap: 14px; align-items: center; }

      var lvl = (t === '-5 €' || t === '-1 €') ? 1 : (t === '-10 €' ? 2 : 3);
      phone.querySelector('[data-gain-k]').textContent = lvl === 3 ? 'INCROYABLE' : (lvl === 2 ? 'Jackpot !' : 'Gagné !');
      phone.querySelector('[data-gain-v]').textContent = lvl === 3 ? 'Ta pose est offerte' : t.replace('-', '+');
      phone.querySelector('[data-gain-s]').textContent = lvl === 3 ? 'Ta pose de ce mois-ci, c’est cadeau 🎉' : 'dans ta cagnotte · total ' + cagTotal() + ' €';
      phone.querySelector('.gain-screen').textContent = lvl === 3 ? '📸 Screen-moi ça et montre-le-moi au salon !' : 'Tu l’utilises sur tes poses, par tranches de 5 €';
      phone.querySelector('[data-gain-cag]').hidden = lvl === 3;
      gain.className = 'gain gain-' + lvl; gain.hidden = false;
      pluie(lvl === 1 ? 40 : (lvl === 2 ? 80 : 160), lvl === 3);
    }
    phone.querySelector('[data-gain-ok]').addEventListener('click', function () { gain.hidden = true; });
    phone.querySelector('[data-gain-cag]').addEventListener('click', function () { gain.hidden = true; roue.hidden = true; openSp('cagnotte'); });
    function roueLancer(i, demo) {
      roueBusy = true; roueGo.disabled = true; roueRes.textContent = 'Ça tourne…'; roueRes.className = 'roue-res';
      var jitter = Math.random() * 30 - 15;
      var target = 360 - (i * 45 + 22.5) + jitter;
      roueRot += 360 * 5 + ((target - roueRot) % 360 + 360) % 360;
      roueW.style.transform = 'rotate(' + roueRot + 'deg)';
      setTimeout(function () {
        var t = SEG[i];
        if (!demo) { try { localStorage.setItem('dilerna-roue', JSON.stringify({ m: roueMois(), t: t })); } catch (e) {} }
        var eu = /^-(\d+) €$/.exec(t); if (eu) cagAjoute(+eu[1], 'Roue ' + (/^[aeiou]/.test(MOIS[new Date().getMonth()]) ? 'd’' : 'de ') + MOIS[new Date().getMonth()]);
        roueBusy = false;
        if (demo) { roueRes.textContent = roueTexte(t); roueRes.className = 'roue-res win'; var deja = roueLu(); roueGo.disabled = !!(deja && deja.m === roueMois()); } else roueEtat();
        montreGain(t);
      }, 4700);
    }
    roueGo.addEventListener('click', function () {
      if (roueBusy) return;
      var deja = roueLu(); if (deja && deja.m === roueMois()) return roueEtat();
      roueLancer(roueTirage(), false);
    });
    phone.querySelectorAll('[data-roue-demo]').forEach(function (b) { b.addEventListener('click', function () { if (!roueBusy) roueLancer(+b.dataset.roueDemo, true); }); });
    phone.querySelector('[data-alert]').addEventListener('click', function () { go('slots'); });
  });
  document.querySelectorAll('.variants button').forEach(function (b) {
    b.addEventListener('click', function () {
      if (b.dataset.l) { LAYOUT = b.dataset.l; b.parentNode.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); }); document.querySelectorAll('[data-phone]').forEach(function (ph) { render(ph, +(ph.dataset.i || 1)); }); return; }
      var modeChange = !!b.dataset.m;
      if (b.dataset.m) MODE = b.dataset.m; else if (b.dataset.h) HEAD = b.dataset.h; else VARIANT = b.dataset.v;
      b.parentNode.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      document.querySelectorAll('[data-phone]').forEach(function (ph) { render(ph, modeChange ? (MODE === 'after' ? 1 : 0) : +(ph.dataset.i || 0)); });
    });
  });
  /* Le téléphone fait la vraie taille d'un écran (375 × 812, comme ton site en version mobile), réduit d'un bloc pour tenir dans le panneau */
  (function () {
    var fit = document.getElementById('fit'), ph = fit.querySelector('.phone');
    function size() {
      /* Sur un vrai téléphone (ou en mode téléphone), la maquette prend tout l'écran, sans cadre */
      var real = window.innerWidth <= 480;
      document.documentElement.classList.toggle('real-phone', real);
      if (real) { ph.style.transform = 'none'; fit.style.height = window.innerHeight + 'px'; return; }
      var avail = window.innerHeight - fit.getBoundingClientRect().top - 28;
      var k = Math.min(1, avail / 832, (window.innerWidth - 32) / 395);
      ph.style.transform = 'scale(' + k + ')';
      fit.style.height = Math.ceil(832 * k) + 'px';
    }
    size(); window.addEventListener('resize', size);
  })();
</script>


<script>
/* Fiche du club en plein écran (29/10/2026) : on range les éléments, et la barre du haut s'efface quand on descend */
(function () {
  var sheet = document.querySelector('.sheet'); if (!sheet) return;
  var top = sheet.querySelector('.sheet-top'), body = sheet.querySelector('.body'), foot = sheet.querySelector('.sheet-foot');
  if (!top || !body || !foot) return;
  var name = document.createElement('p'); name.className = 'fp-name'; name.textContent = 'Club Dilerna'; top.appendChild(name);
  var deja = foot.querySelector('.deja');
  if (deja) {
    // « Déjà membre ? » sur une ligne, « Je me connecte » dessous (on garde le vrai lien, avec son action)
    var tn = deja.firstChild;
    if (tn && tn.nodeType === 3) { var sp = document.createElement('span'); sp.textContent = tn.textContent.trim(); deja.replaceChild(sp, tn); }
    top.appendChild(deja);
  }
  var fin = document.createElement('div'); fin.className = 'fp-fin';
  ['.offrir', '.foot-note', '.legal'].forEach(function (q) { var el = foot.querySelector(q); if (el) fin.appendChild(el); });
  function sacs(root) {
    (root || document).querySelectorAll('.lw-txt:not([data-fx])').forEach(function (t) {
      t.setAttribute('data-fx', '1');
      var c = t.cloneNode(true); c.setAttribute('class', 'lw-txt2'); c.removeAttribute('data-fx');
      c.setAttribute('transform', 'matrix(-1 0 0 1 ' + (2 * parseFloat(t.getAttribute('x'))) + ' 0)');
      t.parentNode.insertBefore(c, t.nextSibling);
    });
  }
  sacs(document);
  function range() {
    sacs(body);
    // après chaque affichage de la fiche : le titre des avantages, la petite ligne sous la carte, et la fin de liste
    var card = body.querySelector('.h2v'), note = fin.querySelector('.foot-note');
    if (card && note && note.textContent.trim() && !body.querySelector('.fp-terms')) {
      var t = document.createElement('p'); t.className = 'fp-terms'; t.textContent = note.textContent; card.insertAdjacentElement('afterend', t);
    }
    if (note) note.hidden = true;
    var ul = body.querySelector('ul.perks');
    if (ul && !body.querySelector('.fp-h')) {
      var h = document.createElement('p'); h.className = 'fp-h';
      h.innerHTML = '<b>Tes avantages</b><span>' + ul.children.length + ' avantages</span>';
      ul.parentNode.insertBefore(h, ul);
    }
    var gift = foot.querySelector('.gift-recu');
    if (gift && card) card.insertAdjacentElement('afterend', gift);
    if (fin.parentNode !== body || body.lastElementChild !== fin) body.appendChild(fin);
  }
  var obs = new MutationObserver(function () { obs.disconnect(); range(); obs.observe(body, { childList: true }); });
  range(); obs.observe(body, { childList: true });
  body.addEventListener('scroll', function () {
    if (body.scrollTop > 60) sheet.classList.add('fp-bas'); else if (body.scrollTop < 30) sheet.classList.remove('fp-bas');
  }, { passive: true });
  // fermer = revenir sur dilerna.fr (sauf l'écran de connexion, qui ramène sur la fiche)
  var phone = sheet.closest('.phone');
  var avant = !phone ? '' : phone.classList.contains('open') ? 'fiche' : phone.classList.contains('space-open') ? 'espace' : '';
  if (phone) new MutationObserver(function () {
    var ouvert = phone.classList.contains('open'), espace = phone.classList.contains('space-open');
    var etat = ouvert ? 'fiche' : espace ? 'espace' : '';
    if (!etat && avant && document.documentElement.classList.contains('reel')) {
      var lock = phone.querySelector('[data-lock]');
      if (avant === 'espace' && lock && !lock.hidden) phone.classList.add('open');
      else location.replace('https://dilerna.fr/');
    }
    avant = etat || avant;
  }).observe(phone, { attributes: true, attributeFilter: ['class'] });
  // quand la fiche se rouvre, elle repart du haut
  new MutationObserver(function () { if (!document.querySelector('.phone.open')) { body.scrollTop = 0; sheet.classList.remove('fp-bas'); } })
    .observe(sheet.closest('.phone') || document.body, { attributes: true, attributeFilter: ['class'] });
})();
</script>
